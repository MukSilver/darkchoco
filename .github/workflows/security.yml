name: 안전

# 코드 리뷰로만 막을 수 있던 규칙을 CI 로 자동화합니다.
#
# 통합 전 minsmiths/whs4-dark 에 있던 것을 되살렸습니다. 2026-08-27 에
# 팀 저장소가 그 앱을 흡수할 때 이 파일이 안 따라왔고, 8/30 에 원본
# 폴더를 지우면서 검사 넷이 통째로 사라졌습니다.
#
# **규칙을 그대로 옮기지 않았습니다.** 원본은 크롤러 하나짜리 저장소용이라
# 「밖으로 보내는 코드 금지」와 「내려받기 금지」가 통합본에서는 바로 걸립니다.
# 알림 앱은 밖으로 보내는 것이 하는 일이고, iter_content 는 내려받는 것이
# 아니라 크기 상한을 거는 안전장치입니다. 그래서 아래처럼 좁혔습니다.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 잡 ID 는 영문·숫자·-·_ 만 됩니다. ci.yml 과 같은 이유로 바꿨습니다.
  code-check:
    name: 코드에 금지한 것이 들어왔나
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 크로미움을 샌드박스 없이 띄우면 그 페이지가 우리 기기에서 그대로 돕니다.
      # 다크웹 페이지를 여는 도구라 이것만은 어떤 이유로도 안 됩니다.
      # 주석으로 "쓰지 말라"고 적는 것은 허용해야 하므로 # 로 시작하는 줄은 뺍니다.
      - name: 브라우저 샌드박스를 끄는 인자가 있나
        run: |
          if grep -rn --include='*.py' --include='Dockerfile' -- \
              '--no-sandbox\|--disable-setuid-sandbox' . \
              | grep -v -E '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::--no-sandbox / --disable-setuid-sandbox 는 쓰지 않습니다"
            exit 1
          fi

      # 이 저장소는 읽는 것이 본업입니다. 밖으로 보내는 자리는 알림 둘뿐이고
      # 그 둘은 무엇을 어디로 보내는지 코드에 적혀 있습니다.
      # 새로 생기면 그것이 의도한 것인지 사람이 봐야 합니다.
      - name: 알림 밖에서 밖으로 보내는 코드가 생겼나
        run: |
          # bash 변수 이름은 아스키여야 합니다. 한글로 두면 그 줄에서 죽습니다
          ALLOW='apps/kr-leak-alarm/collector/notify.py|skills/collect/notify.py'
          if grep -rn -E 'requests\.post|smtplib|socket\.send' \
              --include='*.py' . \
              | grep -v -E "$ALLOW" \
              | grep -v -E '/tests?/|test_'; then
            echo "::error::알림 파일 밖에서 밖으로 보내는 코드가 발견됐습니다"
            echo "::error::의도한 것이면 위 허용 목록에 파일을 더하고 왜 그런지 적으십시오"
            exit 1
          fi

      # 유출물을 받아 두지 않습니다. 있는지 없는지만 적습니다.
      # iter_content 는 원본 규칙에 있었지만 뺐습니다. 지금 저장소에서는
      # 응답을 조각으로 읽어 크기 상한을 거는 데 쓰고 있어서, 오히려
      # 안 받게 막는 코드입니다. 진짜 받아 저장하는 것은 아래 둘입니다.
      - name: 파일을 받아 저장하는 코드가 생겼나
        run: |
          if grep -rn -E 'urlretrieve|shutil\.copyfileobj' \
              --include='*.py' . \
              | grep -v -E '/tests?/|test_'; then
            echo "::error::파일을 받아 저장하는 코드가 발견됐습니다"
            exit 1
          fi

      # 레포가 공개라 Actions 로그도 90일 동안 누구나 봅니다. 명부 이름은
      # 노션에서 오므로 깃허브가 가려 주지 않습니다. --요약만 이 그것을 막습니다.
      # 빼면 우리가 어디를 보고 있는지가 목록으로 나갑니다.
      # 이 파일 자신은 뺍니다. 검사 문구가 찾는 낱말을 그대로 담고 있습니다
      - name: 워크플로가 명부를 요약 없이 찍나
        run: |
          if grep -rn 'dc\.py crawl' .github/workflows/ \
              | grep -v '^\.github/workflows/security\.yml:' \
              | grep -v -e '--요약만' -e '^[^:]*:[0-9]*: *#'; then
            echo "::error::워크플로에서 dc.py crawl 을 부를 때는 --요약만 을 붙입니다"
            echo "::error::로그가 공개라 명부 이름이 그대로 나갑니다"
            exit 1
          fi

      # Tor 가 자꾸 실패할 때 「일단 나가게 하자」 로 손이 가는 자리입니다.
      # 그러면 러너 주소로 다크웹에 붙습니다. 워크플로에서는 막습니다.
      - name: 워크플로가 맨 연결을 허락하나
        run: |
          if grep -rn 'DARKCHOCO_ALLOW_DIRECT' .github/workflows/ \
              | grep -v '^\.github/workflows/security\.yml:' \
              | grep -v -E '^[^:]*:[0-9]*: *#'; then
            echo "::error::워크플로에서 DARKCHOCO_ALLOW_DIRECT 를 쓰지 않습니다"
            echo "::error::Tor 없이 나가는 것은 로컬에서 사람이 알고 하는 일입니다"
            exit 1
          fi

      # 비밀값은 저장소 밖 ~/.config/darkchoco 에 둡니다. 코드에 박으면 안 됩니다.
      - name: 비밀값이 코드에 박혀 있나
        run: |
          if grep -rnE '(api_hash|api_id|token|secret|webhook)[[:space:]]*=[[:space:]]*["'"'"'][A-Za-z0-9_-]{16,}' \
              --include='*.py' --include='*.json' --include='*.yaml' . \
              | grep -v -E '/tests?/|test_|example|sample'; then
            echo "::error::값이 박힌 비밀값으로 보이는 것이 있습니다"
            exit 1
          fi

  secret-history:
    name: 커밋 이력에 비밀값이 섞였나
    runs-on: ubuntu-latest
    # gitleaks 가 PR 커밋 목록을 읽습니다. 이 권한이 없으면 스캔 전에 403 으로 죽습니다.
    # 2026-09-06 첫 실행이 그랬습니다. 그때까지 이 잡은 한 번도 스캔한 적이 없습니다.
    permissions:
      contents: read
      pull-requests: read
    # **첫 판은 실패해도 넘어갑니다.** 옛 커밋에 무엇이 있는지 아직 안 봤습니다.
    # 한 번 돌려 결과를 보고 깨끗하면 이 줄을 지웁니다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
