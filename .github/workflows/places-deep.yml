name: 게시처 깊은 판

# 포럼 · 랜섬 게시처 DB 에서 **열린 곳(online · http)만** 브라우저로 다시 열어 수집기 일곱을 돌리고,
# 빈칸만 채웁니다. 코드와 까닭은 `hub/places/deep.py` 에 있습니다 (2026-09-29 최현서, 인계 H-4).
#
# ## 왜 따로 된 워크플로인가
#
# 얕은 판(places.yml crawl-tor)이 한 판 48~53분이고 잡 제한이 120분입니다. 깊은 판은 갈래마다
# 상한 90분이라 같은 잡에 넣으면 넘칩니다. 그래서 떼고 제한을 넉넉히 둡니다(240분).
# 같은 게시처 DB 에 둘이 동시에 쓰지 않게 places.yml 과 동시 실행 묶음(places)을 같이 씁니다.
#
# ## 무엇을 쓰나
#
# **빈칸만 채우는 칸과 이어 붙이는 칸만** 씁니다. 상태 · 확인일 · 규모 · 주소는 얕은 판 몫입니다.
# 사람이 채운 칸은 안 건드립니다. 챌린지를 만나면 그 곳은 값을 버리고 건너뜁니다 — 사람이 풀어야
# 하는 곳이라 우회하지 않습니다.
#
# ## 예약은 미리보기 한 판을 본 뒤에 켭니다
#
# 기준(최현서 9/29): 잡 제한 안에 끝남 · 사람 값 덮어쓰기 0 · 실패로 멈추지 않음. 셋 다 맞으면
# 아래 on 에 schedule 을 더합니다. 로그 끝의 「예약에 넣어도 되나」 가 그 판정입니다.
#
# ## 로그에 이름을 안 찍습니다
#
# 레포가 공개라 Actions 로그를 누구나 봅니다. deep.py 는 건수만 찍습니다.
#
# ## 넣어야 하는 비밀값 하나
#
#   NOTION_TOKEN   노션 통합 토큰

on:
  workflow_dispatch:
    # 입력 이름은 영문 · 숫자 · - · _ 만 됩니다 (places.yml 머리말)
    inputs:
      only:
        description: "어느 갈래를 볼지"
        type: choice
        default: all
        options: [all, forum, ransom]
      write_to_notion:
        description: "노션에 실제로 쓸지. 끄면 미리보기만"
        type: boolean
        default: false
      limit:
        description: "갈래마다 최대 몇 줄까지. 0 은 전부"
        type: string
        default: "0"

concurrency:
  group: places
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRITE: ${{ github.event_name == 'schedule' && 'yes' || (inputs.write_to_notion && 'yes' || 'no') }}

jobs:
  deep:
    name: 깊은 판 (Tor · 브라우저)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 부품과 브라우저 설치
        # 깊은 판은 playwright 가 있어야 돕니다. 크롬과 그 시스템 라이브러리까지 깝니다
        run: |
          set -e
          pip install -e packages playwright
          python -m playwright install --with-deps chromium

      - name: 비밀값을 파일로
        env:
          TOKEN_VALUE: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/cfg"
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::NOTION_TOKEN 이 없습니다"
            exit 1
          fi
          printf '%s' "$TOKEN_VALUE" > "$RUNNER_TEMP/cfg/notion_token"
          chmod 600 "$RUNNER_TEMP/cfg/notion_token"

      - name: tor 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tor

      - name: torrc 쓰고 되읽어 확인
        # places.yml 과 같습니다. ExcludeExitNodes 가 빠지면 한국 출구를 씁니다
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tor/data"
          chmod 700 "$RUNNER_TEMP/tor/data"
          cat > "$RUNNER_TEMP/tor/torrc" <<TORRC
          DataDirectory $RUNNER_TEMP/tor/data
          Log notice file $RUNNER_TEMP/tor/notices.log
          HTTPTunnelPort 9080
          SocksPort 0
          ExcludeExitNodes {kr}
          StrictNodes 1
          TORRC
          grep -q 'ExcludeExitNodes {kr}' "$RUNNER_TEMP/tor/torrc" || {
            echo "::error::torrc 에 ExcludeExitNodes 가 없습니다"; exit 1; }
          grep -q 'StrictNodes 1' "$RUNNER_TEMP/tor/torrc" || {
            echo "::error::torrc 에 StrictNodes 가 없습니다"; exit 1; }
          grep -q 'HTTPTunnelPort 9080' "$RUNNER_TEMP/tor/torrc" || {
            echo "::error::torrc 에 HTTPTunnelPort 가 없습니다"; exit 1; }
          echo "torrc 세 줄 확인"

      - name: tor 띄우기
        run: |
          set -e
          nohup tor -f "$RUNNER_TEMP/tor/torrc" > "$RUNNER_TEMP/tor/stdout.log" 2>&1 &
          for i in $(seq 1 60); do
            if grep -q 'Bootstrapped 100%' "$RUNNER_TEMP/tor/notices.log" 2>/dev/null; then
              echo "tor 준비됨 (${i}0초)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::tor 가 5분 안에 안 떴습니다"
          tail -20 "$RUNNER_TEMP/tor/notices.log" 2>/dev/null || true
          exit 1

      - name: 관문 — Tor 로 나가는지 확인
        # 밖으로 나가는 요청은 여기가 처음입니다. 브라우저도 이 터널로만 나갑니다
        env:
          TOR_SOCKS_PROXY: http://127.0.0.1:9080
        run: |
          python - <<'PY'
          import sys, time
          sys.path[:0] = ["packages", "."]
          from hub.places import egress
          for 판 in range(3):
              r = egress.출구확인(timeout=20)
              print(r["말"])
              if r["된다"]:
                  raise SystemExit(0)
              if 판 < 2:
                  time.sleep(20)
          print("::error::Tor 로 안 나갑니다. 요청을 하나도 안 보내고 멈춥니다")
          raise SystemExit(1)
          PY

      - name: 깊은 판
        env:
          NOTION_TOKEN_FILE: ${{ runner.temp }}/cfg/notion_token
          TOR_SOCKS_PROXY: http://127.0.0.1:9080
          ONLY_INPUT: ${{ inputs.only }}
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          set -e
          LIMIT="${LIMIT_INPUT:-0}"
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=0;; esac
          case "${ONLY_INPUT:-all}" in
            forum)  ONLY=forum ;;
            ransom) ONLY=ransom ;;
            *)      ONLY=forum,ransom ;;
          esac
          if [ "$WRITE" = "yes" ]; then
            python -m hub.places.deep --only "$ONLY" --limit "$LIMIT" --잡제한분 240 --apply
          else
            python -m hub.places.deep --only "$ONLY" --limit "$LIMIT" --잡제한분 240
          fi

      - name: 뒷정리
        if: always()
        run: |
          pkill -x tor || true
          rm -rf "$RUNNER_TEMP/tor"
          rm -f "$RUNNER_TEMP/cfg/notion_token"
