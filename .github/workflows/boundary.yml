name: 자리검사

# 가지 이름과 고친 파일을 대조해 트랙 경계를 넘었는지 알립니다.
#
# **실패시키지 않습니다.** 2026-09-22 에 「명부 조사를 깃허브 액션으로」가
# 명부 코드와 워크플로를 같이 고쳐야 하는 일이었습니다. 막았으면 그 일이
# 멈춥니다. 보이게 하는 것이 목적입니다.
#
# CODEOWNERS 로는 안 됩니다. 거기 최현서가 거의 모든 자리에 들어 있어서
# 어느 트랙이 무엇을 고치든 본인 승인으로 지나갑니다. 사람 기준이라
# 트랙을 못 가립니다.
#
# 경계 정본은 DEV.md 0절입니다. 2026-09-23.

on:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-check:
    name: 자리를 넘었나
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 고친 파일을 모은다
        run: |
          # 셸 변수 이름에 한글을 쓰지 않습니다. bash 가 못 읽습니다.
          # checkout 의 fetch-depth: 0 이 이미 전체를 받으므로 --depth 를 주지
          # 않습니다. --depth=0 은 「깊이 없음」이 아니라 오류입니다.
          git fetch origin "${{ github.base_ref }}" --quiet
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          git diff --name-only "$base"..HEAD > /tmp/changed.txt
          git diff "$base"..HEAD -- dc.py > /tmp/diff.txt || true
          echo "고친 파일 $(wc -l < /tmp/changed.txt)개"

      - name: 대조한다
        run: |
          python .github/boundary.py \
            "${{ github.head_ref }}" /tmp/changed.txt /tmp/diff.txt \
            | tee /tmp/out.txt
          cat /tmp/out.txt >> "$GITHUB_STEP_SUMMARY"
          if grep -q "자리 밖을 고쳤습니다" /tmp/out.txt; then
            echo "::warning title=자리 밖::트랙 경계를 넘었습니다. Summary 를 보십시오"
          fi
