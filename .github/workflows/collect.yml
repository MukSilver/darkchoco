name: 수집

# 여섯 시간마다 밖에서 긁어 노션 수집 DB 로 올립니다. **로컬 PC 가 필요 없습니다.**
#
# 전에는 사람이 자기 컴퓨터에서 제어판을 켜야만 돌았습니다. 그러면 그 사람이 안 켜는
# 동안 아무것도 안 모입니다. 실제로 텔레그램이 8/27 이후 열흘 넘게 멈춰 있었습니다.
#
# ## 여기서 못 하는 것
#
#   텔레그램 실계정   세션 파일을 올리면 그 계정으로 남이 읽습니다. 로컬에 둡니다
#   포럼 킷          사람이 브라우저에서 눌러야 돕니다
#
# 둘 다 원래 사람 손이 들어가는 자리라 로컬로 남는 것이 자연스럽습니다.
#
# ## 표를 안 남깁니다
#
# 실행마다 새 컨테이너라 SQLite 가 안 남습니다. **그것이 문제가 안 됩니다.**
# 정본은 노션이고 SQLite 는 통로입니다. 겹침은 push.py 가 노션에서 UID·원문 URL 을
# 읽어 막습니다. 매번 새 표에 긁어도 이미 있는 것은 안 올라갑니다.
#
# 잃는 것은 게시글 본문입니다. 그것은 어차피 노션에 안 보내고, 검증할 때 사람이
# 원문을 따로 봅니다.
#
# ## 넣어야 하는 비밀값 둘
#
#   NOTION_TOKEN        노션 통합 토큰
#   DARKCHOCO_CHANNELS  볼 채널 목록. 한 줄에 하나. **무엇을 보는지가 드러나는 목록이라
#                       레포에 안 둡니다**
#
# 레포 Settings → Secrets and variables → Actions 에서 넣습니다.

on:
  schedule:
    # 여섯 시간마다. UTC 기준이라 KST 로는 09 · 15 · 21 · 03 시입니다.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      올리기:
        description: "노션에 실제로 올릴지. 끄면 미리보기만 합니다"
        type: boolean
        default: true
      랜섬:
        description: "랜섬웨어 집계처를 볼지"
        type: boolean
        default: true
      텔레그램:
        description: "텔레그램 공개 미리보기를 볼지"
        type: boolean
        default: true

# 겹쳐 돌지 않게 합니다. 같은 노션 DB 에 둘이 쓰면 겹침 판정이 어긋납니다.
concurrency:
  group: 수집
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gather:
    name: 긁어서 노션으로
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 부품 설치
        run: pip install -e "packages[all]"

      - name: 비밀값을 파일로
        # **환경변수 대신 파일로 둡니다.** 환경변수는 하위 프로세스 목록과
        # 셸 이력에 남습니다. dc_notion 이 NOTION_TOKEN_FILE 을 먼저 봅니다.
        env:
          토큰: ${{ secrets.NOTION_TOKEN }}
          채널: ${{ secrets.DARKCHOCO_CHANNELS }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/cfg"
          if [ -z "$토큰" ]; then
            echo "::error::NOTION_TOKEN 이 없습니다. 레포 Settings → Secrets 에 넣으십시오"
            exit 1
          fi
          printf '%s' "$토큰" > "$RUNNER_TEMP/cfg/notion_token"
          chmod 600 "$RUNNER_TEMP/cfg/notion_token"
          if [ -n "$채널" ]; then
            printf '%s\n' "$채널" > "$RUNNER_TEMP/cfg/telegram_channels"
            echo "채널 $(grep -cve '^\s*$' -e '^#' "$RUNNER_TEMP/cfg/telegram_channels" || true) 개"
          else
            echo "::warning::DARKCHOCO_CHANNELS 가 없습니다. 텔레그램을 건너뜁니다"
          fi

      - name: 랜섬웨어 집계처
        # **한 소스가 막혀도 다음으로 갑니다.** 집계처가 GitHub 주소를 막을 수 있어
        # 여기서 죽으면 텔레그램까지 같이 못 돕니다.
        if: ${{ github.event_name == 'schedule' || inputs.랜섬 }}
        continue-on-error: true
        working-directory: skills
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          NOTION_TOKEN_FILE: ${{ runner.temp }}/cfg/notion_token
        run: python -m collect.sources.ransomlive kr --db "$RUNNER_TEMP/darkchoco.db"

      - name: 텔레그램 공개 미리보기
        if: ${{ github.event_name == 'schedule' || inputs.텔레그램 }}
        continue-on-error: true
        working-directory: skills
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          DARKCHOCO_CHANNELS: ${{ runner.temp }}/cfg/telegram_channels
          NOTION_TOKEN_FILE: ${{ runner.temp }}/cfg/notion_token
        run: |
          if [ -f "$DARKCHOCO_CHANNELS" ]; then
            python -m collect.main --db "$RUNNER_TEMP/darkchoco.db" --no-ransom || \
              python -m collect.main --db "$RUNNER_TEMP/darkchoco.db"
          else
            echo "채널 목록이 없어 건너뜁니다"
          fi

      - name: 긁은 것 세기
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os, sqlite3, pathlib, collections
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "darkchoco.db"
          if not p.is_file():
              print("표가 안 만들어졌다. 두 소스가 다 막혔거나 0건이다")
              raise SystemExit(0)
          c = sqlite3.connect(str(p))
          n = c.execute("select count(*) from items where forgotten=0").fetchone()[0]
          별 = collections.Counter(r[0] for r in c.execute(
              "select source from items where forgotten=0"))
          org = c.execute(
              "select count(*) from items where forgotten=0 and target_org!=''").fetchone()[0]
          print("긁은 줄 %d — %s" % (n, " · ".join("%s %d" % x for x in 별.items())))
          print("그중 대상 조직이 있는 줄 %d" % org)
          PY

      - name: 노션에 올리기
        # 미검토로 들어갑니다. 사람이 사건 O / X 를 고르기 전에는 지도·통계가 안 봅니다.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          NOTION_TOKEN_FILE: ${{ runner.temp }}/cfg/notion_token
        run: |
          set -e
          if [ ! -f "$RUNNER_TEMP/darkchoco.db" ]; then
            echo "올릴 표가 없습니다"; exit 0
          fi
          올릴까="${{ github.event_name == 'schedule' && 'yes' || inputs.올리기 }}"
          if [ "$올릴까" = "yes" ] || [ "$올릴까" = "true" ]; then
            python hub/events/push.py --db "$RUNNER_TEMP/darkchoco.db" --kr --apply
          else
            echo "미리보기만 합니다"
            python hub/events/push.py --db "$RUNNER_TEMP/darkchoco.db" --kr
          fi

      - name: 표를 안 남긴다
        # 게시글 본문이 든 파일입니다. 아티팩트로도 안 남깁니다.
        if: always()
        run: rm -f "$RUNNER_TEMP/darkchoco.db" "$RUNNER_TEMP/cfg/notion_token"
