name: 디코 수집 브리핑
run-name: ${{ inputs.send && '브리핑 보냄' || '브리핑 시험' }}

# 지난 브리핑 뒤 수집 DB 에 새로 들어온 사건을 디스코드 브리핑 채널에 올립니다 (2026-10-01).
#
# ## 수집 · 검증이 끝날 때마다 보냅니다 — 최현서 10/03
#
# 하루 네 번 수집이 끝나면 부릅니다(send=true). 부르는 쪽은 둘입니다.
#   - 노션에 새 줄을 올린 판: 수집이 Claude 클라우드 판정(검증)을 부르고, **판정이 끝날 때 판정 쪽이** 이 워크플로를
#     부릅니다. 판정이 찾은 「사건 O 후보」 의 LEAK 번호를 candidates 로 넘기면 「AI 판정 한국 후보(확정 전)」 로 싣습니다
#   - 새 줄이 없거나 판정 부르기에 실패한 판: 수집이 바로 부릅니다
# 범위는 **마지막으로 보낸 판(「브리핑 보냄」)이 시작한 때부터** 입니다. 못 읽으면 지난 24시간입니다. 새 줄이 0건이어도 보냅니다.
# 손 시험 판(send=false, 「브리핑 시험」)은 범위 계산에 넣지 않습니다. 아래 「매일 09:00」 은 10/02 ~ 10/03 의 옛 방식입니다.
# 코드와 까닭은 `skills/collect/brief.py` 에 있습니다.
#
# ## 매일 09:00 KST 에 보냅니다 — 최현서 10/02
#
# 문안 꼴은 최현서가 10/02 에 정했습니다(LEAK-번호 · 조직명 · 행위자 · 한국 여부). 끝에 대시보드 링크를 붙입니다.
#
# **예약은 05:00 KST(20:00 UTC) 에 겁니다.** 이 레포의 예약 실행은 2~6시간 늦게 깹니다(10/02 에 9/26~10/02 예약
# 실행 시각을 잰 값. 00:23 UTC 수집이 05:49 UTC 에 돌았습니다). 9시에 걸면 오후에 갑니다. 그래서 일찍 깨워 두고
# 09:00 KST 까지 기다렸다가 보냅니다. 9시가 지나서 깨면 바로 보냅니다. 레포가 공개라 기다리는 시간은 과금되지 않습니다.
# GitHub 이 예약 실행을 통째로 건너뛰는 날도 있습니다(수집이 하루 넷 중 셋만 돈 날이 있었습니다).
#
# 손으로 돌릴 때는 기본이 **보내지 않음** 입니다. 보내지 않는 판은 문안 건수를 세고 웹후크가 브리핑 채널을 가리키는지만 봅니다.
#
# ## 보내기 전에 웹후크를 확인합니다
#
# 웹후크 주소를 GET 하면 디스코드가 그 웹후크의 채널 번호를 돌려줍니다(글은 안 올라감). 브리핑 채널이
# 아니면 보내지 않고 실패로 끝냅니다. 9/22 에 받은 옛 웹후크는 다른 채널이었습니다.
#
# ## 로그에는 건수와 「맞음 / 틀림」 만
#
# 레포가 공개라 Actions 로그를 누구나 봅니다. **문안에는 조직명이 들어 있습니다.** `--요약만` 을 빼지 마십시오. 웹후크 주소는 비밀값으로만
# 넘기고 어디에도 찍지 않습니다. 문안 미리보기는 노션 토큰이 있는 PC 에서 `python skills/collect/brief.py` 로 봅니다.
#
# ## 넣어야 하는 비밀값 둘
#
#   NOTION_TOKEN      노션 통합 토큰(읽기만 씁니다)
#   DISCORD_WEBHOOK   브리핑 채널 웹후크 주소
#
# 그리고 하나 더. 없으면 링크 줄만 빠지고 나머지는 그대로 갑니다.
#
#   DASH_URL          대시보드 주소. 비밀번호로 잠근 내부 화면이라 레포에 적지 않습니다

on:
  workflow_dispatch:
    # 입력 이름은 영문 · 숫자 · - · _ 만 됩니다 (places.yml 머리말)
    inputs:
      send:
        description: "디코에 실제로 보낼지. 끄면 문안 건수와 웹후크 채널 확인만"
        type: boolean
        default: false
      candidates:
        description: "AI 판정 한국 후보 LEAK 번호, 쉼표로 (예: LEAK-451,LEAK-460). 번호만 넘긴다 — 이 값은 공개로 보인다"
        type: string
        default: ""

concurrency:
  group: brief
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  brief:
    name: 브리핑
    runs-on: ubuntu-latest
    # 05:00 KST 에 바로 깨면 4시간을 기다립니다. 그만큼 여유를 둡니다
    timeout-minutes: 15
    steps:
      # 예약 판만 기다립니다. 저녁(UTC)에 깼으면 다음 날 00:00 UTC = 09:00 KST 까지 잡니다
      - name: 지난 브리핑 시각
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(gh run list -R "${{ github.repository }}" --workflow brief.yml --status success --limit 30 --json createdAt,event,displayTitle --jq '[.[] | select(.displayTitle == "브리핑 보냄" or .event == "schedule")][0].createdAt // ""' 2>/dev/null || true)
          echo "since=$s" >> "$GITHUB_OUTPUT"
          echo "지난 브리핑 시각: ${s:-없음(지난 24시간)}"
          # 손으로 돌린 판(보내지 않는 시험)은 세지 않는다. 그 판을 세면 다음 자동 브리핑이 그 사이 줄을 건너뛴다

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 부품 설치
        run: pip install -e packages

      - name: 비밀값을 파일로
        env:
          TOKEN_VALUE: ${{ secrets.NOTION_TOKEN }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/cfg"
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::NOTION_TOKEN 이 없습니다"
            exit 1
          fi
          printf '%s' "$TOKEN_VALUE" > "$RUNNER_TEMP/cfg/notion_token"
          chmod 600 "$RUNNER_TEMP/cfg/notion_token"

      - name: 브리핑
        env:
          NOTION_TOKEN_FILE: ${{ runner.temp }}/cfg/notion_token
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DASH_URL: ${{ secrets.DASH_URL }}
          # 예약 판은 보냅니다. 손으로 돌릴 때는 send 를 켜야 보냅니다
          SEND: ${{ inputs.send && 'yes' || 'no' }}
          CANDIDATES: ${{ inputs.candidates }}
          SINCE: ${{ steps.since.outputs.since }}
        run: |
          set -e
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK 이 없습니다"
            exit 1
          fi
          # **--요약만 을 빼지 마십시오.** 머리말에 이유가 있습니다
          if [ "$SEND" = "yes" ]; then
            python skills/collect/brief.py --요약만 --보낸다 ${SINCE:+--부터 "$SINCE"} --후보 "$CANDIDATES"
          else
            python skills/collect/brief.py --요약만 --확인 ${SINCE:+--부터 "$SINCE"} --후보 "$CANDIDATES"
          fi

      - name: 뒷정리
        if: always()
        run: rm -f "$RUNNER_TEMP/cfg/notion_token"
