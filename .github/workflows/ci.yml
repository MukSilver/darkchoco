name: 테스트

# 워크플로는 루트 .github/ 에만 둡니다. 하위 폴더의 것은 깃허브가 안 봅니다.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # 잡 ID 는 영문·숫자·-·_ 만 됩니다. 한글이면 깃허브가 파일 단계에서 막아
  # 잡이 하나도 안 돕니다. 2026-08-28 부터 50번이 전부 그렇게 실패했습니다.
  # 화면에 보이는 이름은 name: 이라 한글 그대로 둡니다.
  parts:
    name: 공용 부품과 툴킷
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 기본 설치는 밖에서 받는 것이 없어야 합니다. 그것부터 확인합니다.
      - name: 부품 설치 (맨몸)
        run: pip install -e packages

      - name: 표준 라이브러리만으로 되는지
        run: python packages/tests/test_표준만.py

      - name: 조사기를 우회하는 코드가 없는지
        run: python packages/tests/test_직접호출금지.py

      - name: 옵션까지 설치
        run: pip install -e "packages[all]"

      - name: 부품 테스트
        run: |
          for f in packages/tests/test_*.py; do
            echo "── $f"
            python "$f"
          done
        env:
          PYTHONIOENCODING: utf-8

  apps:
    name: 앱 자체 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "packages[all]"

      - name: kr-leak-alarm
        working-directory: apps/kr-leak-alarm
        run: |
          pip install -r requirements.txt
          python -m tests.test_all
        env:
          PYTHONIOENCODING: utf-8

      # 앱이 둘인데 이 일이 하나만 돌고 있었습니다.
      # **test_monitor_ordering 만 돌립니다.** 같은 폴더의 test.py 는 실제로
      # 텔레그램에 로그인하고 test_classifier.py 는 디스코드로 보냅니다.
      # 둘 다 GitHub 서버가 밖으로 나가는 일이라 CI 에서 돌리면 안 됩니다.
      - name: tg-korea-alert
        working-directory: apps/tg-korea-alert
        run: |
          pip install -r requirements.txt
          python -m unittest test_monitor_ordering -v
        env:
          PYTHONIOENCODING: utf-8

      # **아무것도 깔지 않습니다.** talkaid 의 시험은 모델을 안 올립니다.
      # ctranslate2 는 engine.load() 안에서만 import 하므로 없어도 돕니다.
      # 모델을 받게 하면 CI 가 1.2GB 를 내려받고 밖으로 나갑니다.
      # 번역 품질은 기계가 못 보는 것이라 사람이 눈으로 봅니다.
      - name: talkaid
        working-directory: apps/talkaid
        run: |
          python tests/test_engine.py
          python tests/test_talkaid.py
          python tests/test_ui.py
        env:
          PYTHONIOENCODING: utf-8

  skills:
    name: skills 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CI 가 skills/ 를 아예 안 부르고 있었습니다. 도구 둘이 거기 있습니다.
      # skills/collect/fetch.py 가 requests 를 부릅니다. 전에는 「표준 라이브러리만」 이라 안 깔았는데
      # 2026-09-06 첫 실행에서 ModuleNotFoundError 로 멈췄습니다. 잡 ID 가 한글이던 때는 여기까지 온 적이 없습니다.
      - run: pip install requests
      - name: skills 아래 검사 전부
        run: |
          set -e
          for f in $(find skills -name "test_*.py" -not -path "*__pycache__*" | sort); do
            echo "── $f"
            python "$f"
          done
        env:
          PYTHONIOENCODING: utf-8

  no-install:
    name: 설치 없이 --help 가 뜨는지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 일부러 아무것도 안 깝니다. 남의 도구를 훑어보는 상황입니다.
      # 이름의 수를 아래 줄 수와 맞춥니다. 「여섯」이라 적혀 있는데 다섯만
      # 있었습니다. 명령을 더하거나 뺄 때 이름도 같이 고칩니다.
      - name: 다섯 진입점
        run: |
          set -e
          python dc.py list
          python dc.py plan
          python dc.py install-task --show
          python dc.py readme --check
          (cd apps/tg-korea-alert   && python korea_alert_monitor.py --help > /dev/null)
          echo "전부 뜹니다"
        env:
          PYTHONIOENCODING: utf-8
