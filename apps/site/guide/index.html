<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유출 대응 가이드라인 — 다크초코</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  .stage { display: grid; grid-template-columns: 336px 1fr; gap: var(--s4);
           padding: var(--s4); align-items: start; height: calc(100vh - 53px); }
  @media (max-width: 1000px) { .stage { grid-template-columns: 1fr; height: auto; } }
  .side { height: 100%; overflow-y: auto; }
  .main { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s3); }

  .listhead { display: flex; align-items: baseline; gap: var(--s2); }
  .listhead .count { margin-left: auto; font-size: var(--t-tiny); color: var(--faint);
                     font-variant-numeric: tabular-nums; }
  .q { width: 100%; margin-top: var(--s3); padding: 8px 11px; border-radius: var(--r2);
       background: var(--sunk); border: 1px solid var(--line); color: var(--ink);
       font: inherit; font-size: var(--t-small); }
  .q::placeholder { color: var(--faint); }
  .caserow { display: block; width: 100%; text-align: left; cursor: pointer; font: inherit;
             background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r2);
             padding: 10px 12px; margin-top: var(--s2); color: inherit; }
  .caserow:hover { border-color: var(--line-hard); }
  .caserow[data-on] { border-color: var(--v-likely); background: var(--panel); }
  .caserow b { display: block; color: var(--ink); font-size: var(--t-small); margin-bottom: 5px; }
  .caserow .n { margin-left: var(--s2); font-size: var(--t-tiny); color: var(--faint); }
  .more { font-size: var(--t-tiny); color: var(--faint); padding-top: var(--s3); }

  .gate { display: flex; flex-direction: column; gap: var(--s3); }
  .gate .reach { font-size: 21px; font-weight: 700; color: var(--ink); }
  .gate .reachsub { font-size: var(--t-small); color: var(--muted); }
  .gate.blocked { border-color: var(--v-false); }
  .gate.blocked .reach { color: var(--v-false); }
  .items { display: flex; flex-wrap: wrap; gap: 6px; }
  .it { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
        border-radius: var(--r4); font-size: var(--t-small); font-weight: 600;
        border: 1px solid var(--line); background: var(--sunk); color: var(--faint); }
  .it[data-s="confirmed"] { color: var(--v-confirmed); border-color: var(--v-confirmed); }
  .it[data-s="claimed"] { color: var(--muted); border-style: dashed; }
  .it em { font-style: normal; font-size: var(--t-tiny); opacity: .75; }

  .combos { display: grid; gap: 6px; }
  .combo { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); align-items: center;
           padding: 9px 12px; border-radius: var(--r2); background: var(--sunk);
           border: 1px solid var(--line); border-left: 3px solid var(--warn); }
  .combo b { color: var(--ink); font-size: var(--t-small); white-space: nowrap; }
  .combo span { color: var(--muted); font-size: var(--t-small); }

  .sect > h3 { display: flex; align-items: baseline; gap: var(--s2); margin-bottom: var(--s3); }
  .sect > h3 .sub { font-size: var(--t-tiny); color: var(--faint); font-weight: 400; }
  .sect > h3 .mins { margin-left: auto; font-size: var(--t-tiny); color: var(--faint); }
  .act { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s3);
         padding: 11px 13px; border-radius: var(--r2); background: var(--sunk);
         border: 1px solid var(--line); margin-bottom: 6px; }
  .act .t { color: var(--ink); font-size: var(--t-body); font-weight: 600; }
  .act .why { grid-column: 1; color: var(--faint); font-size: var(--t-tiny); }
  .act .tags { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column;
               align-items: flex-end; gap: 4px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: var(--r4);
         border: 1px solid var(--line); color: var(--faint); white-space: nowrap; }
  .act .desk { grid-column: 1 / -1; font-size: var(--t-tiny); color: var(--link);
               padding-top: 3px; }

  .none { color: var(--faint); font-size: var(--t-small); border: 1px dashed var(--line-hard);
          border-radius: var(--r2); padding: var(--s4); }
  .empty-main { display: flex; align-items: center; justify-content: center; height: 100%;
                color: var(--faint); font-size: var(--t-h3); }
  .desks { display: grid; gap: 6px; }
  .desk-row { display: grid; grid-template-columns: 178px 1fr; gap: var(--s3);
              padding: 9px 12px; border-radius: var(--r2); background: var(--sunk);
              border: 1px solid var(--line); font-size: var(--t-small); }
  .desk-row b { color: var(--ink); }
  .desk-row span { color: var(--muted); }
  .toolbar { display: flex; gap: var(--s4); align-items: center; padding-bottom: var(--s5); }
  .toolbar a { font-size: var(--t-small); }

  @media print {
    :root { --bg: #fff; --panel: #fff; --sunk: #fff; --ink: #000; --body: #222;
            --muted: #333; --faint: #555; --line: #bbb; --line-hard: #888; }
    .shell-head, .side, .toolbar { display: none !important; }
    .stage { display: block; height: auto; padding: 0; }
    .main { height: auto; overflow: visible; }
    .card { break-inside: avoid; border-color: #bbb; }
  }
</style>
</head>
<body>

<div class="stage">
  <aside class="side"><div class="card" id="caselist"></div></aside>
  <main class="main" id="main"></main>
</div>

<script type="module">
import { mountHead, loadData, el, currentCase, linkToCase, REACH, confirmedItems }
  from "../assets/shell.js";

const base = mountHead("guide");
const { data } = await loadData(base);
const G = await (await fetch(`${base}/data/guide.json`)).json();

const ITEM  = Object.fromEntries(G.item_types.map(i => [i.id, i]));
const PURP  = Object.fromEntries(G.purposes.map(p => [p.id, p]));
const DESK  = Object.fromEntries(G.desks.map(d => [d.id, d]));
const GATE  = Object.fromEntries(G.gates.map(g => [g.id, g]));
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

let picked = null, q = "";

// ── 왼쪽. 300건을 늘어놓지 않고 좁혀서 찾습니다.
function renderList() {
  const box = document.getElementById("caselist");
  box.innerHTML = "";
  const hits = data.cases
    .filter(c => !q || (c.title + c.industry).toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => confirmedItems(b).length - confirmedItems(a).length);
  const head = el("div", { class: "listhead" });
  head.append(el("h2", {}, "어느 사고입니까"),
              el("span", { class: "count" }, `${hits.length} / ${data.cases.length}`));
  box.append(head);
  const inp = el("input", { class: "q", type: "search", value: q,
                            placeholder: "업종이나 자료로 좁히기" });
  inp.addEventListener("input", e => { q = e.target.value; renderList();
    const n = document.querySelector(".q"); n.focus(); n.setSelectionRange(999, 999); });
  box.append(inp);
  for (const c of hits.slice(0, 40)) {
    const b = el("button", { class: "caserow", type: "button",
                             ...(picked && picked.id === c.id ? { "data-on": "1" } : {}) });
    b.append(el("b", {}, c.title),
             el("span", { class: "pill", "data-verdict": c.verdict }, c.verdict),
             el("span", { class: "n" }, `${confirmedItems(c).length}개 확인`));
    b.addEventListener("click", () => { picked = c; renderList(); renderMain(); });
    box.append(b);
  }
  if (hits.length > 40)
    box.append(el("p", { class: "more" }, `${hits.length - 40}건 더 있습니다. 좁혀 보십시오`));
  if (!hits.length) box.append(el("p", { class: "more" }, "걸리는 사고가 없습니다"));
}

// ── 오른쪽. 확인된 것과, 그것 때문에 생기는 할 일.
function renderMain() {
  const m = document.getElementById("main");
  m.innerHTML = "";
  if (!picked) { m.append(el("div", { class: "empty-main" }, "왼쪽에서 사고를 고르십시오")); return; }
  const c = picked;
  const reach = REACH[(c.reach || {}).state] || REACH.unknown;
  const conf = confirmedItems(c);
  const blocked = c.gate === "blocked";

  const g = el("div", { class: "card gate" + (blocked ? " blocked" : "") });
  g.append(el("div", { class: "reach" },
    blocked ? "허위로 판정한 사고입니다" : `샘플에서 확인한 항목 ${conf.length}개`));
  g.append(el("div", { class: "reachsub" },
    blocked ? "이 사고를 근거로는 어떤 조치도 만들지 않습니다"
            : `${reach.label} · ${reach.sub}`));
  if (!blocked) {
    const box = el("div", { class: "items" });
    for (const [id, state] of Object.entries(c.items || {})) {
      const t = ITEM[id]; if (!t) continue;
      box.append(el("span", { class: "it", "data-s": state },
        el("span", {}, t.label), el("em", {}, state === "confirmed" ? "확인" : "주장만")));
    }
    g.append(box);
    g.append(el("p", { style: "font-size:var(--t-tiny);color:var(--faint)" },
      `게시글은 ${Object.keys(c.items || {}).length}개를 주장했고 그중 ${conf.length}개를 샘플에서 확인했습니다.`));
  }
  m.append(g);
  if (blocked) return;

  const hits = (G.combos || []).filter(cb => cb.items.every(i => conf.includes(i)));
  if (hits.length) {
    const box = el("div", { class: "card sect" });
    box.append(el("h3", {}, el("span", {}, "합쳐지면 생기는 위험"),
                            el("span", { class: "sub" }, "확인된 항목끼리만 셉니다")));
    const grid = el("div", { class: "combos" });
    for (const cb of hits)
      grid.append(el("div", { class: "combo" },
        el("b", {}, cb.items.map(i => ITEM[i].label).join(" + ")), el("span", {}, cb.harm)));
    box.append(grid);
    m.append(box);
  }

  const acts = (G.actions || []).filter(a => (a.items || []).some(i => conf.includes(i)));
  for (const st of G.stages) {
    const mine = acts.filter(a => a.stage === st.id);
    if (!mine.length) continue;
    const mins = mine.reduce((s, a) => s + (a.minutes || 0), 0);
    const box = el("div", { class: "card sect" });
    box.append(el("h3", {}, el("span", {}, st.label), el("span", { class: "sub" }, st.sub),
                            el("span", { class: "mins" }, mins ? `약 ${mins}분` : "")));
    for (const a of mine) {
      const row = el("div", { class: "act" });
      row.append(el("div", { class: "t" }, a.text));
      if (a.why) row.append(el("div", { class: "why" }, a.why));
      const tags = el("div", { class: "tags" });
      const p = PURP[a.purpose];
      if (p) tags.append(el("span", { class: "tag", style: `color:${css(p.color)};border-color:${css(p.color)}` }, p.label));
      for (const i of (a.items || []).filter(i => conf.includes(i)))
        tags.append(el("span", { class: "tag" }, ITEM[i].label));
      row.append(tags);
      if (a.desk && DESK[a.desk])
        row.append(el("div", { class: "desk" }, `${DESK[a.desk].label} — ${DESK[a.desk].what}`));
      box.append(row);
    }
    m.append(box);
  }

  if (!acts.length) {
    const box = el("div", { class: "card sect" });
    box.append(el("h3", {}, el("span", {}, "이 사고에서 낼 조치가 없습니다")));
    const why = conf.length === 0
      ? "샘플에서 확인된 항목이 없습니다. 게시글의 주장만으로는 조치를 만들지 않습니다."
      : `확인된 것이 ${conf.map(i => (ITEM[i] || {}).label || i).join(" · ")}뿐입니다. ` +
        "이 항목들은 단독으로는 피해로 이어지지 않아 조치를 걸지 않았습니다. " +
        "「기타」는 무엇인지 나눈 뒤에 조치가 붙습니다.";
    box.append(el("p", { class: "none" }, why));
    m.append(box);
  }

  const silent = Object.keys(c.items || {}).filter(i => !conf.includes(i));
  if (silent.length) {
    const box = el("div", { class: "card sect" });
    box.append(el("h3", {}, el("span", {}, "이 사고에서는 할 일이 없는 항목")));
    box.append(el("p", { class: "none" },
      silent.map(i => (ITEM[i] || {}).label || i).join(" · ") +
      " — 게시글이 주장했지만 샘플에서 확인되지 않았습니다. 전체에 없다는 뜻은 아닙니다."));
    m.append(box);
  }

  const need = new Set(acts.map(a => a.desk).filter(Boolean));
  if (need.size) {
    const box = el("div", { class: "card sect" });
    box.append(el("h3", {}, el("span", {}, "어디에 말합니까")));
    const grid = el("div", { class: "desks" });
    for (const id of need)
      grid.append(el("div", { class: "desk-row" },
        el("b", {}, DESK[id].label), el("span", {}, DESK[id].what)));
    box.append(grid);
    m.append(box);
  }

  const bar = el("div", { class: "toolbar" });
  bar.append(el("a", { href: linkToCase(base, "map", c.id) }, "이 사고가 어디를 거쳤는지 →"));
  const pr = el("a", { href: "#" }, "종이 한 장으로 뽑기");
  pr.addEventListener("click", e => { e.preventDefault(); window.print(); });
  bar.append(pr);
  m.append(bar);
}

const wanted = currentCase();
if (wanted != null) picked = data.cases.find(c => c.id === wanted) || null;
renderList();
renderMain();
</script>
</body>
</html>
