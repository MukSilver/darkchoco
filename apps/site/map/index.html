<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생태계 지도 — 다크초코</title>
<link rel="stylesheet" href="../assets/tokens.css">
<style>

  .stage { display: grid; grid-template-columns: 1fr 336px; gap: var(--s4);
           padding: var(--s4); align-items: start; height: calc(100vh - 53px); }
  .board { height: 100%; display: flex; align-items: center; }
  .side { height: 100%; overflow-y: auto; }
  @media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } }

  .board { background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--r3); overflow: hidden; }
  .board svg { display: block; width: 100%; height: auto; }

  .side { display: flex; flex-direction: column; gap: var(--s3); }
  .side h2 { font-size: var(--t-h3); }
  .funnel { display: flex; flex-direction: column; gap: var(--s2); }
  .funnel .row { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center;
                 gap: var(--s2); font-size: var(--t-small); }
  .funnel .bar { height: 10px; border-radius: var(--r4); background: var(--sunk);
                 overflow: hidden; }
  .funnel .bar i { display: block; height: 100%; background: var(--k-forum); }
  .funnel .gap { font-size: var(--t-tiny); color: var(--faint); padding-left: 88px; }

  .picked .name { color: var(--ink); font-size: 17px; font-weight: 700; }
  .picked dl { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s3);
               margin-top: var(--s3); font-size: var(--t-small); }
  .picked dt { color: var(--faint); }
  .picked dd { color: var(--muted); font-weight: 600; }

  .listhead { display: flex; align-items: baseline; gap: var(--s2); }
  .listhead .count { margin-left: auto; font-size: var(--t-tiny); color: var(--faint);
                     font-variant-numeric: tabular-nums; }
  .q { width: 100%; margin-top: var(--s3); padding: 8px 11px; border-radius: var(--r2);
       background: var(--sunk); border: 1px solid var(--line); color: var(--ink);
       font: inherit; font-size: var(--t-small); }
  .q::placeholder { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: var(--s3); }
  .chipbreak { flex-basis: 100%; height: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
          padding: 4px 9px; border-radius: var(--r4); background: var(--sunk);
          border: 1px solid var(--line); color: var(--muted);
          font: inherit; font-size: var(--t-tiny); }
  .chip i { font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip[data-on] { background: var(--k-forum); border-color: var(--k-forum); color: #fff; }
  .chip[data-on] i { color: rgba(255,255,255,.75); }
  .rows { margin-top: var(--s3); }
  .more { font-size: var(--t-tiny); color: var(--faint); padding: var(--s3) 0 0; }
  .caserow[data-on] { border-color: var(--k-forum); }
  .caserow { display: block; width: 100%; text-align: left; cursor: pointer;
             background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r2);
             padding: 10px 12px; margin-top: var(--s2); color: inherit; font: inherit; }
  .caserow:hover { border-color: var(--line-hard); }
  .caserow b { display: block; color: var(--ink); font-size: var(--t-small); margin-bottom: 5px; }
  .caserow .hops { margin-left: var(--s2); font-size: var(--t-tiny); color: var(--faint); }
  .legend { display: flex; flex-direction: column; gap: var(--s3); }
  .legend .grp { display: flex; flex-direction: column; gap: 6px; }
  .legend .grp b { font-size: var(--t-tiny); color: var(--ink); }
  .legend .it { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-tiny);
                color: var(--muted); }
  .legend .line { width: 30px; height: 0; border-top-width: 3px; border-top-style: solid; }
</style>
</head>
<body>

<div class="stage">
  <div class="board"><svg id="map" viewBox="0 0 1280 820" role="img"
       aria-label="오픈웹과 다크웹 두 층의 벌집 지도. 층 사이를 오가는 선이 유출물의 이동입니다."></svg></div>

  <aside class="side">
    <div class="card">
      <h2>지금까지 확인한 것</h2>
      <div class="funnel" id="funnel"></div>
    </div>
    <div class="card picked" id="picked"></div>
    <div class="card" id="caselist"></div>
    <div class="card legend" id="legend"></div>
  </aside>
</div>

<script type="module">
import { mountHead, loadData, el, currentCase, linkToCase, REACH }
  from "../assets/shell.js";
import { makeGrid, growBlob, outline, bbox, edgePoint, curve, polyPoints } from "../assets/hex.js";

const base = mountHead("map");
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const add = (tag, at = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(at)) n.setAttribute(k, v);
  svg.append(n);
  return n;
};
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

const ROAD = {
  flat:       { c: css("--road"),        dash: null,   w: 3.4 },
  drop:       { c: css("--road-drop"),   dash: "10 6", w: 3.2 },
  rise:       { c: css("--road-rise"),   dash: null,   w: 4.0 },
  exposure:   { c: css("--road-expose"), dash: "9 6",  w: 3.0 },
  succession: { c: css("--road-succ"),   dash: "8 5",  w: 2.6 },
};

let data;
try {
  ({ data } = await loadData(base));
  if (!data.places || !data.places.length) throw new Error("자리 데이터가 비어 있습니다");
} catch (e) {
  document.querySelector(".board").innerHTML =
    `<p class="empty" style="margin:var(--s6)">지도를 못 읽었습니다 — ${e.message}<br>` +
    `<small>서버로 띄웠는지, data/leak-map.json 이 있는지 확인하십시오.</small></p>`;
  throw e;
}


// ── 배치. 두 층이 같은 격자를 씁니다. 그래야 같은 자리가 위아래로 겹칩니다.
const cellsOf = p => p.investigated ? Math.max(2, Math.round((p.cases || 1) * 0.9)) : 1;
const demand = Math.max(...data.layers.map(l =>
  data.places.filter(p => p.layer === l.id).reduce((s, p) => s + cellsOf(p), 0)));
// 판이 60%쯤 차게 여유를 둡니다. 꽉 채우면 덩어리가 서로를 막습니다.
const COLS = Math.ceil(Math.sqrt(demand / 0.6 * 1.7));
const ROWS = Math.ceil(demand / 0.6 / COLS) + 2;
const CELL = Math.max(5.5, Math.min(13, 560 / COLS));
const Z = Math.round(CELL * 31);
const grid = makeGrid({ size: CELL, originX: 168, originY: 612 });
const kindColor = Object.fromEntries(data.kinds.map(k => [k.id, k.color]));
const kindColorFor = (kind, layer) =>
  layer === "deep" ? (css(`--k-${kind}-deep`) || kindColor[kind]) : kindColor[kind];

// 층별로 업종 덩어리를 키웁니다. 같은 업종은 두 층에서 같은 자리를 씁니다.
const ANCHOR = { forum: [.16, .42], ransom: [.50, .28], telegram: [.82, .50],
                 archive: [.48, .82], market: [.80, .80], broker: [.88, .20] };
const placeCell = {};   // place.id -> [ [c,r], ... ]
const allCells = [];

for (const layer of data.layers) {
  const z = layer.id === "sky" ? Z : 0;
  const taken = new Map();
  const landAll = [];
  for (const kind of data.kinds) {
    const here = data.places.filter(p => p.layer === layer.id && p.kind === kind.id);
    if (!here.length) continue;
    const [ax, ay] = ANCHOR[kind.id] || [.5, .5];
    // 업종 대륙을 먼저 키우고, 그 안에서 자리별로 나눠 줍니다.
    const total = here.reduce((s, p) => s + cellsOf(p), 0);
    const seed = [Math.round(ax * (COLS - 1)), Math.round(ay * (ROWS - 1))];
    const land = growBlob({ seed, count: total, cols: COLS, rows: ROWS,
                            taken, world: grid.world });
    // 자리를 일렬로 자르면 라벨이 한 줄에 겹칩니다. 각자 씨앗에서 키웁니다.
    const landSet = new Map(land.map(([c, r]) => [c + "," + r, false]));
    const sorted = [...here].sort((a, b) => (b.cases || 0) - (a.cases || 0));
    for (let si = 0; si < sorted.length; si++) {
      const p = sorted[si];
      const n = cellsOf(p);
      // 대륙 안에서 아직 안 쓴 칸 중, 이미 쓴 칸에서 가장 먼 것을 씨앗으로
      const free = land.filter(([c, r]) => !landSet.get(c + "," + r));
      if (!free.length) { placeCell[p.id] = []; continue; }
      let seed2 = free[0], best = -1;
      for (const f of free) {
        const [fx, fy] = grid.world(f[0], f[1]);
        let d = Infinity;
        for (const [c, r] of land) {
          if (!landSet.get(c + "," + r)) continue;
          const [wx, wy] = grid.world(c, r);
          d = Math.min(d, (wx - fx) ** 2 + (wy - fy) ** 2);
        }
        if (d === Infinity) { seed2 = free[Math.floor(free.length / 2)]; break; }
        if (d > best) { best = d; seed2 = f; }
      }
      const sub = new Map();
      for (const [k, v] of landSet) if (v) sub.set(k, true);
      const got = growBlob({ seed: seed2, count: n, cols: COLS, rows: ROWS,
                             taken: sub, world: grid.world })
                  .filter(([c, r]) => landSet.has(c + "," + r));
      for (const [c, r] of got) landSet.set(c + "," + r, true);
      placeCell[p.id] = got;
    }
    landAll.push(...land);
    // 대륙 바탕 — 자리에 배정되지 않은 칸만. 배정된 칸은 자리가 그립니다.
    const claimed = new Set();
    for (const p of here) for (const [c, r] of (placeCell[p.id] || [])) claimed.add(c + "," + r);
    const g = add("g");
    for (const [c, r] of land) {
      if (claimed.has(c + "," + r)) continue;
      const poly = document.createElementNS(NS, "polygon");
      poly.setAttribute("points", polyPoints(grid.cell(c, r, z)));
      poly.setAttribute("fill", kind.color);
      poly.setAttribute("fill-opacity", ".18");
      g.append(poly);
    }
  }
  allCells.push(...landAll);
}

// ── 판. 두 층이 같은 범위를 씁니다. 그래야 같은 자리가 위아래로 겹쳐 보입니다.
// 격자 크기로 그리면 아무도 안 쓴 칸까지 판이 되어 오른쪽이 빕니다.
const cMin = Math.min(...allCells.map(([c]) => c)), cMax = Math.max(...allCells.map(([c]) => c));
const rMin = Math.min(...allCells.map(([, r]) => r)), rMax = Math.max(...allCells.map(([, r]) => r));
const PAD = grid.size * 1.7, THICK = 22;
for (const layer of [...data.layers].reverse()) {   // 위층을 먼저 깔아 뒤로 보냅니다
  const z = layer.id === "sky" ? Z : 0;
  const [x0, y0] = grid.world(cMin, rMin), [x1, y1] = grid.world(cMax, rMax);
  const corner = (wx, wy) => grid.project(wx, wy, z);
  const c0 = corner(x0 - PAD, y0 - PAD), c1 = corner(x1 + PAD, y0 - PAD),
        c2 = corner(x1 + PAD, y1 + PAD), c3 = corner(x0 - PAD, y1 + PAD);
  const edge = layer.id === "sky" ? css("--k-archive") : css("--k-ransom");
  const dn = ([x, y]) => [x, y + THICK];
  const box = document.createElementNS(NS, "g");
  const put = (tag, at) => { const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(at)) n.setAttribute(k, v); box.append(n); return n; };
  // 옆면 둘 — 이 두께가 층을 갈라 보이게 합니다. 데이터가 아닙니다.
  for (const face of [[c3, c2, dn(c2), dn(c3)], [c2, c1, dn(c1), dn(c2)]]) {
    put("polygon", { points: polyPoints(face), fill: edge, "fill-opacity": ".14",
                     stroke: edge, "stroke-opacity": ".35", "stroke-width": "1" });
  }
  put("polygon", { points: polyPoints([c0, c1, c2, c3]), fill: css("--sunk"),
                   "fill-opacity": ".55", stroke: edge,
                   "stroke-opacity": ".5", "stroke-width": "1.4" });
  svg.prepend(box);
  const lab = add("g");
  const lx = Math.min(c0[0], c3[0]) - 16, ly = c0[1] + 8;
  const mk = (at, txt) => { const n = document.createElementNS(NS, "text");
    for (const [k, v] of Object.entries(at)) n.setAttribute(k, v);
    n.textContent = txt; lab.append(n); };
  mk({ x: lx, y: ly, "text-anchor": "end", fill: edge,
       "font-size": "18", "font-weight": "700" }, layer.name);
  mk({ x: lx, y: ly + 17, "text-anchor": "end", fill: css("--faint"),
       "font-size": "11.5" }, layer.sub);
}

// ── 자리 칸 (진한 것만 색을 채웁니다)
const boxOf = {};
for (const p of data.places) {
  const cells = placeCell[p.id] || [];
  if (!cells.length) continue;
  const z = p.layer === "sky" ? Z : 0;
  boxOf[p.id] = bbox(cells, z, grid);
  const g = add("g", { class: "place", tabindex: "0", role: "button",
                       "aria-label": (p.investigated && p.name)
                         ? `${p.name} · 확인한 사고 ${p.cases || 0}건`
                         : "아직 안 본 자리" });
  g.dataset.pid = p.id;
  for (const [c, r] of cells) {
    const poly = document.createElementNS(NS, "polygon");
    poly.setAttribute("points", polyPoints(grid.cell(c, r, z)));
    poly.setAttribute("fill", kindColorFor(p.kind, p.layer));
    poly.setAttribute("fill-opacity", p.investigated ? ".95" : ".26");
    if (!p.investigated) { poly.setAttribute("stroke", kindColorFor(p.kind, p.layer));
                           poly.setAttribute("stroke-opacity", ".4"); }
    g.append(poly);
  }
  for (const [a, b] of (p.investigated ? outline(cells, z, grid) : [])) {
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", a[0].toFixed(1)); ln.setAttribute("y1", a[1].toFixed(1));
    ln.setAttribute("x2", b[0].toFixed(1)); ln.setAttribute("y2", b[1].toFixed(1));
    ln.setAttribute("stroke", p.investigated ? css("--bg") : kindColorFor(p.kind, p.layer));
    ln.setAttribute("stroke-width", p.investigated ? "1.4" : "1.6");
    g.append(ln);
  }
  g.addEventListener("click", () => pick(p));
  g.addEventListener("keydown", e => { if (e.key === "Enter") pick(p); });
}

// ── 길. 방향을 화살촉으로 답니다. 건수를 sqrt 로 굵기에 싣습니다.
// 선은 덩어리 경계 밖에서 시작·종료해야 화살촉이 칸 밑에 안 묻힙니다.
const flowW = f => {
  const n = f.cases || 1, W = Math.sqrt(n);
  return Math.max(2, Math.min(12, 2 + W * 1.4));   // sqrt 스케일, 2~12px 클램프
};
const roadLayer = add("g");   // 선은 한 겹에 모읍니다
for (const f of data.flows) {
  const A = boxOf[f.from], B = boxOf[f.to];
  if (!A || !B) continue;
  const st = ROAD[f.kind] || ROAD.flat;
  const side = f.kind === "rise" ? -1 : 1;
  const p1 = edgePoint(A, B.cx, B.cy, 4);
  const p2 = edgePoint(B, A.cx, A.cy, 12);   // 화살촉 자리를 남깁니다
  const cv = curve(p1, p2, { bend: .16, side });
  const d = cv.d;
  const w = flowW(f);
  const confirmed = f.confidence === "confirmed";
  const op = confirmed ? ".92" : ".62";
  const put = (at) => { const n = document.createElementNS(NS, "path");
    for (const [k, v] of Object.entries(at)) n.setAttribute(k, v); roadLayer.append(n); return n; };
  // 케이싱 — 배경색 이중 스트로크. 선이 칸을 가로질러도 읽힙니다.
  put({ d, fill: "none", stroke: css("--bg"), "stroke-width": w + 3,
        "stroke-opacity": ".8", "stroke-linecap": "round" });
  const road = put({ class: "road", d, fill: "none", stroke: st.c, "stroke-width": w,
        "stroke-opacity": op, "stroke-linecap": "round",
        ...(confirmed ? {} : { "stroke-dasharray": `${w * 2} ${w * 1.4}` }) });
  road.dataset.from = f.from; road.dataset.to = f.to;
  road.dataset.w = w; road.dataset.op = op;
  // 화살촉 — 끝점에서 곡선 접선 방향으로
  const ang = Math.atan2(p2[1] - cv.mid[1], p2[0] - cv.mid[0]);
  const ah = Math.max(6, w * 1.6);
  const a1 = [p2[0] - ah * Math.cos(ang - 0.42), p2[1] - ah * Math.sin(ang - 0.42)];
  const a2 = [p2[0] - ah * Math.cos(ang + 0.42), p2[1] - ah * Math.sin(ang + 0.42)];
  const head = document.createElementNS(NS, "polygon");
  head.setAttribute("points", polyPoints([p2, a1, a2]));
  head.setAttribute("fill", st.c); head.setAttribute("fill-opacity", op);
  head.classList.add("roadhead");
  head.dataset.from = f.from; head.dataset.to = f.to;
  roadLayer.append(head);
}

// ── 자리 이름표
const used = [];
for (const p of [...data.places].filter(p => p.investigated)
                                .sort((a, b) => (b.cases || 0) - (a.cases || 0))) {
  const b = boxOf[p.id]; if (!b) continue;
  const label = `${p.name} · ${p.cases || 0}건`;
  const w = label.length * 8.4 + 18;
  let y = b.y0 - 24;
  for (let k = 0; k < 9; k++) {
    const clash = used.some(u => Math.abs(y - u.y) < 20 &&
                                 Math.abs(b.cx - u.x) < (w + u.w) / 2 + 8);
    if (!clash) break;
    y -= 21;
  }
  used.push({ x: b.cx, y, w });
  const lg = add("g", { class: "seatlabel" }); lg.dataset.pid = p.id;
  const _add = (tag, at) => { const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(at)) n.setAttribute(k, v); lg.append(n); return n; };
  _add("line", { x1: b.cx, y1: y + 19, x2: b.cx, y2: b.cy, stroke: kindColor[p.kind],
                "stroke-width": "1", "stroke-opacity": ".6" });
  _add("rect", { x: b.cx - w / 2, y, width: w, height: 19, rx: "4",
                fill: css("--sunk"), stroke: kindColor[p.kind], "stroke-width": "1" });
  _add("text", { x: b.cx, y: y + 14, "text-anchor": "middle", fill: css("--ink"),
                "font-size": "11.5", "font-weight": "600" }).textContent = label;
}

// ── 오른쪽 — 깔때기
const S = data.stats, FUN = [["reported", "보도된 사고"], ["matched", "다크웹 대조"],
                             ["circulating", "유통 확인"], ["judged", "판정 완료"]];
const fun = document.getElementById("funnel");
FUN.forEach(([k, label], i) => {
  fun.append(el("div", { class: "row" },
    el("span", { style: "color:var(--faint)" }, label),
    el("div", { class: "bar" }, el("i", { style: `width:${(S[k] / S.reported) * 100}%` })),
    el("b", { class: "mono", style: "text-align:right;color:var(--ink)" }, String(S[k]))));
  if (i < FUN.length - 1) {
    const next = FUN[i + 1];
    fun.append(el("div", { class: "gap" },
      `여기서 ${S[k] - S[next[0]]}건이 다음 단계로 못 갔습니다`));
  }
});

// ── 사건 상태 — 고른 사고가 지난 자리만 남깁니다
let picked = null;
function showCase(c) {
  picked = c;
  const on = new Set((c.hops || []).map(h => h.place));
  svg.querySelectorAll("g.place").forEach(g => {
    g.setAttribute("opacity", on.has(g.dataset.pid) ? "1" : ".16");
  });
  const litPair = (a, b) => {
    for (let i = 0; i < (c.hops || []).length - 1; i++)
      if (c.hops[i].place === a && c.hops[i + 1].place === b) return true;
    return false;
  };
  svg.querySelectorAll("path.road").forEach(pt => {
    const lit = litPair(pt.dataset.from, pt.dataset.to);
    pt.setAttribute("stroke-opacity", lit ? "1" : ".07");
    pt.setAttribute("stroke-width", lit ? (+pt.dataset.w + 2) : pt.dataset.w);
  });
  svg.querySelectorAll("polygon.roadhead").forEach(h => {
    h.setAttribute("fill-opacity", litPair(h.dataset.from, h.dataset.to) ? "1" : ".07");
  });
  svg.querySelectorAll("g.seatlabel").forEach(g => {
    g.setAttribute("opacity", on.has(g.dataset.pid) ? "1" : ".14");
  });
  const reach = REACH[(c.reach || {}).state] || REACH.unknown;
  const box = document.getElementById("picked");
  box.style.display = "";
  box.innerHTML = "<h2>고른 사고</h2>";
  box.append(
    el("div", { class: "name" }, c.title),
    el("div", { style: "margin-top:6px" },
       el("span", { class: "pill", "data-verdict": c.verdict }, c.verdict)),
    el("p", { style: "margin-top:var(--s3);color:var(--ink);font-weight:600;font-size:var(--t-small)" },
       reach.label),
    el("p", { style: "font-size:var(--t-tiny);color:var(--faint)" }, reach.sub),
    (() => { const ol = el("ol", { style: "margin:var(--s3) 0 0 var(--s4);font-size:var(--t-small);color:var(--muted)" });
      for (const h of (c.hops || [])) {
        const li = el("li", {}, document.createTextNode(h.name || "미상"));
        li.append(el("span", { style: "color:var(--faint)" }, ` · ${h.relation}`));
        ol.append(li);
      }
      return ol; })(),
    el("p", { style: "margin-top:var(--s3)" },
       el("a", { href: linkToCase(base, "guide", c.id) }, "이 사고에서 무엇을 해야 하는지 →")),
    el("p", { style: "margin-top:var(--s2)" },
       el("a", { href: "#", id: "clearcase" }, "← 전체 보기로")));
  document.getElementById("clearcase").addEventListener("click", e => { e.preventDefault(); clearCase(); });
}

function clearCase() {
  picked = null;
  svg.querySelectorAll("g.place, g.seatlabel").forEach(g => g.removeAttribute("opacity"));
  svg.querySelectorAll("path.road").forEach(pt => {
    pt.setAttribute("stroke-opacity", pt.dataset.op);
    pt.setAttribute("stroke-width", pt.dataset.w);
  });
  svg.querySelectorAll("polygon.roadhead").forEach(h => h.setAttribute("fill-opacity", h.dataset.op || ".9"));
  document.getElementById("picked").innerHTML = "";
  document.getElementById("picked").style.display = "none";
  renderCaseList();
}

let filt = { q: "", verdict: null, reach: null };

function matches(c) {
  if (filt.verdict && c.verdict !== filt.verdict) return false;
  if (filt.reach && (c.reach || {}).state !== filt.reach) return false;
  if (filt.q && !(c.title + c.industry).toLowerCase().includes(filt.q.toLowerCase())) return false;
  return true;
}

let listBuilt = false;
function buildCaseList() {
  const box = document.getElementById("caselist");
  box.innerHTML = "";
  const head = el("div", { class: "listhead" });
  head.append(el("h2", {}, "사고"), el("span", { class: "count", id: "casecount" }, ""));
  box.append(head);

  // 검색창은 딱 한 번 만듭니다. 다시 만들면 한국어 조합이 끊깁니다.
  const q = el("input", { class: "q", type: "search", placeholder: "업종이나 자료로 좁히기",
                          "aria-label": "사고 검색", value: filt.q });
  let composing = false;
  q.addEventListener("compositionstart", () => { composing = true; });
  q.addEventListener("compositionend", () => { composing = false; filt.q = q.value; paintCaseList(); });
  q.addEventListener("input", () => { if (composing) return; filt.q = q.value; paintCaseList(); });
  box.append(q);

  box.append(el("div", { class: "chips", id: "chips" }));
  box.append(el("div", { class: "rows", id: "rows" }));
  listBuilt = true;
}

function paintCaseList() {
  if (!listBuilt) buildCaseList();
  const hits = data.cases.filter(matches);
  document.getElementById("casecount").textContent = `${hits.length} / ${data.cases.length}`;

  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  const addChip = (key, val, label) => {
    const on = filt[key] === val;
    const save = filt[key]; filt[key] = val;
    const n = data.cases.filter(matches).length; filt[key] = save;
    if (!n && !on) return;
    const b = el("button", { class: "chip", type: "button", ...(on ? { "data-on": "1" } : {}) });
    b.append(el("span", {}, label), el("i", {}, String(n)));
    b.addEventListener("click", () => { filt[key] = on ? null : val; paintCaseList(); });
    chips.append(b);
  };
  for (const v of ["확인됨", "신뢰성 높음", "미확인", "신뢰성 낮음", "허위"]) addChip("verdict", v, v);
  chips.append(el("div", { class: "chipbreak" }));
  for (const [k, l] of [["deep-only", "다크웹 안"], ["surfaced", "오픈웹까지"],
                        ["public", "검색까지"]]) addChip("reach", k, l);

  const rows = document.getElementById("rows");
  const frag = document.createDocumentFragment();
  for (const c of hits.slice(0, 60)) {
    const b = el("button", { class: "caserow", type: "button",
                             ...(picked && picked.id === c.id ? { "data-on": "1" } : {}) });
    b.append(el("b", {}, c.title),
             el("span", { class: "pill", "data-verdict": c.verdict }, c.verdict),
             el("span", { class: "hops" }, `${(c.hops || []).length}곳`));
    b.addEventListener("click", () => showCase(c));
    frag.append(b);
  }
  if (hits.length > 60)
    frag.append(el("p", { class: "more" }, `아래로 ${hits.length - 60}건 더 있습니다. 좁혀 보십시오`));
  if (!hits.length) frag.append(el("p", { class: "more" }, "걸리는 사고가 없습니다"));
  rows.innerHTML = ""; rows.append(frag);
}

const renderCaseList = paintCaseList;

// ── 칸 고르기
function pick(p) {
  if (picked) clearCase();          // 사건 상태에서 자리를 누르면 먼저 빠져나옵니다
  const box = document.getElementById("picked");
  box.style.display = "";           // 비었을 때 감춰 둔 것을 되살립니다
  const layer = data.layers.find(l => l.id === p.layer);
  const kind = data.kinds.find(k => k.id === p.kind);
  const linked = data.flows.filter(f => f.from === p.id || f.to === p.id).length;
  box.innerHTML = "<h2>고른 자리</h2>";

  // 이름만 아는 자리는 name 이 없습니다. undefined 를 찍지 않고 상태를 말합니다.
  const named = p.investigated && p.name;
  box.append(
    named
      ? el("div", { class: "name", style: `color:${kindColorFor(p.kind, p.layer)}` },
           document.createTextNode(p.name))
      : el("div", { class: "name", style: "color:var(--muted)" }, "아직 안 본 자리"),
    el("div", { style: "font-size:var(--t-tiny);color:var(--faint)" },
       `${kind.name} · ${layer.name}${p.korea ? " · 한국 관련" : ""}`));

  if (named) {
    box.append(el("dl", { html:
      `<dt>확인한 사고</dt><dd>${p.cases || 0}건</dd>` +
      `<dt>들여다봤나</dt><dd>예</dd>` +
      `<dt>상태</dt><dd>${p.status || "미확인"}</dd>` +
      `<dt>최초 확인</dt><dd>${p.first_seen || "—"}</dd>` +
      `<dt>최근 확인</dt><dd>${p.last_seen || "—"}</dd>` +
      `<dt>이어진 자리</dt><dd>${linked}곳</dd>` }));
    if (p.note) box.append(el("p",
      { style: "margin-top:var(--s3);font-size:var(--t-small)" },
      document.createTextNode(p.note)));
  } else {
    // 이름을 내보내지 않는 이유까지 적습니다. 빈 카드로 두지 않습니다.
    box.append(el("p", { class: "empty", style: "margin-top:var(--s3);text-align:left" },
      "이름만 확보하고 아직 들여다보지 못한 곳입니다. " +
      "안 본 자리의 이름은 밖으로 내보내지 않습니다."));
    box.append(el("dl", { html:
      `<dt>층</dt><dd>${layer.name}</dd>` +
      `<dt>업종</dt><dd>${kind.name}</dd>` +
      `<dt>상태</dt><dd>${p.status || "미확인"}</dd>` }));
  }
}

document.getElementById("picked").style.display = "none";
renderCaseList();
const wanted = currentCase();
if (wanted != null) {
  const c = data.cases.find(x => x.id === wanted);
  if (c) showCase(c);
}

// 배치되지 못한 자리가 있으면 조용히 넘어가지 않습니다.
{
  const placed = Object.values(placeCell).filter(c => c && c.length).length;
  const missing = data.places.length - placed;
  if (missing > 0) {
    console.warn(`[배치] ${missing}곳이 격자에 못 들어갔습니다. COLS/ROWS 를 키우십시오.`);
    const w = add("text", { x: 8, y: 18, fill: css("--warn"), "font-size": "11" });
    w.textContent = `⚠ ${missing}곳 미배치`;
  }
}

// 그린 것에 맞춰 판을 자릅니다. 미리 정한 viewBox 는 늘 남거나 모자랍니다.
{
  const bb = svg.getBBox(), pad = 16;
  svg.setAttribute("viewBox",
    `${(bb.x - pad).toFixed(1)} ${(bb.y - pad).toFixed(1)} ` +
    `${(bb.width + pad * 2).toFixed(1)} ${(bb.height + pad * 2).toFixed(1)}`);
}

// ── 범례
const lg = document.getElementById("legend");
lg.append(el("h2", {}, "범례"));
lg.append(el("div", { class: "grp", html:
  "<b>칸 하나 = 자리 하나</b>" +
  data.kinds.map(k =>
    `<span class="it"><i class="swatch" style="background:${k.color}"></i>${k.name}</span>`).join("") }));
lg.append(el("div", { class: "grp", html:
  "<b>칸 진하기</b>" +
  `<span class="it"><i class="swatch" style="background:${css("--k-forum")}"></i>우리가 들여다본 자리</span>` +
  `<span class="it"><i class="swatch" style="background:${css("--k-forum")};opacity:.26"></i>이름만 아는 자리</span>` }));
lg.append(el("div", { class: "grp", html:
  "<b>길</b>" +
  [["flat", "같은 층 안의 이동"], ["drop", "아래로 — 팔리러 내려감"],
   ["rise", "위로 — 다시 공개됨"], ["exposure", "노출에서 옴"],
   ["succession", "압수 후 후계"]].map(([k, t]) =>
    `<span class="it"><i class="line" style="border-color:${ROAD[k].c};border-top-style:${ROAD[k].dash ? "dashed" : "solid"}"></i>${t}</span>`).join("") }));
</script>
</body>
