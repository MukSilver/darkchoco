<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>다크초코 대시보드</title>
<style>
  :root{
    /* 면. 바탕 → 판 → 판2 위로 올라오고, 깊판만 바탕보다 내려앉는다 */
    --깊판:#0f1116; --바탕:#14161c; --판:#1b1e26; --판2:#22262f;
    /* 선. 흐린줄은 표 안쪽이라 카드 테두리(--줄)보다 약하다.
       139줄이 격자로 보이지 않게 하려는 것이다 */
    --줄:#2c313c; --흐린줄:#232733;
    /* 글 */
    --글:#e6e8ee; --흐린글:#9aa2b4; --더흐린:#6b7385; --코드글:#cdd3e0;
    /* 뜻을 나르는 색. --기다림 은 「사람이 손대면 없어지는 것」,
       --나쁨 은 「손대야만 없어지는 것」이다. 이 선을 지킨다 */
    --점:#8b7bd8; --좋음:#7dc4a0; --기다림:#d8b45f; --나쁨:#d87b7b;
    /* 짚고 있는 줄 */
    --짚음:#1e222b;

    /* 간격 눈금. 밑값이 2px 다. 4px 배수로 잡으면 td 세로 여백을 4 나 8 중에
       골라야 하는데, 7→8px 은 139줄이면 278px 만큼 한 판에 덜 보인다는 뜻이고
       4px 은 13px 글자에 너무 붙는다 */
    --틈1:4px; --틈2:6px; --틈3:8px; --틈4:12px;
    --틈5:16px; --틈6:24px; --틈7:40px;
    /* 모서리. 나란히 놓이는 것끼리 1px 씩 다르면 「대충 만든」 인상이 거기서 온다 */
    --둥1:4px; --둥2:8px; --둥알약:999px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--바탕);color:var(--글);
       font:14px/1.6 "Pretendard","맑은 고딕",system-ui,sans-serif}
  a{color:var(--점)}
  .틀{max-width:1180px;margin:0 auto;padding:var(--틈6) var(--틈5) 64px}

  header{display:flex;align-items:baseline;gap:var(--틈5);flex-wrap:wrap;margin-bottom:var(--틈2)}
  h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .구운때{color:var(--더흐린);font-size:12px}
  /* 화면에서 「이건 문제다」를 내는 유일한 자리다. 딱지 `.없음` 과 같은 색 가족을
     쓰되 본문 덩어리라 글자를 한 단 밝게 잡는다 */
  .경고{background:#3a2a2c;border:1px solid #4d3639;color:#e8b8b8;
        padding:var(--틈4);border-radius:var(--둥2);margin:var(--틈4) 0;font-size:13px}

  .요약{display:flex;gap:var(--틈3);flex-wrap:wrap;margin:var(--틈5) 0 var(--틈6)}
  .칸{background:var(--판);border:1px solid var(--줄);border-radius:var(--둥2);
      padding:var(--틈4) var(--틈5);min-width:112px}
  .칸 b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .칸 span{color:var(--흐린글);font-size:12px}
  .칸.점 b{color:var(--점)} .칸.좋음 b{color:var(--좋음)}
  .칸.기다림 b{color:var(--기다림)} .칸.나쁨 b{color:var(--나쁨)}

  nav{display:flex;gap:var(--틈1);border-bottom:1px solid var(--줄);margin-bottom:var(--틈6)}
  /* 탭의 2px 표시선과 nav 의 1px 밑선이 1px 어긋나 겹쳐 있었다. 탭이 「선 위에
     앉은」 게 아니라 「선 옆에 뜬」 것으로 보이던 전형적인 1px 이다 */
  nav button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
             color:var(--흐린글);padding:var(--틈3) var(--틈5);font:inherit;font-size:14px;cursor:pointer}
  nav button.켬{color:var(--글);border-bottom-color:var(--점)}
  nav button:hover{color:var(--글)}

  /* **절 제목이 표 본문보다 흐리면 안 된다.** 전에는 14px `--흐린글`(7.1:1)이라
     td(13.6:1)보다 1.9배 흐렸다. 1px 큰 것으로는 못 이긴다 — 사람 눈은 1px 차이보다
     대비 1.9배를 먼저 읽는다. 한글 산세리프는 굵게 해도 「더 어두워질」 뿐
     「더 커지지」 않으므로 크기도 한 칸 올린다 */
  h2{font-size:15px;color:var(--글);font-weight:600;margin:var(--틈6) 0 var(--틈3);
     text-transform:none;letter-spacing:.01em}
  h2:first-child{margin-top:0}
  /* 곁말이 h2 의 600 을 물려받아 반굵게 나오던 것을 끊는다 */
  h2 .더흐림{font-weight:400}

  table{width:100%;border-collapse:collapse;font-size:13px}
  /* 전에는 `--더흐린`(3.5:1)이라 WCAG AA(4.5)를 못 넘었다. 열 이름을 못 읽으면
     「자리」와 「게시」가 무엇인지 헷갈리고, 그건 여럿이 같은 잣대로 판정하는 데
     바로 걸린다. td 본문(13.6)보다는 흐리므로 「이름은 틀, 값이 내용」은 유지된다 */
  th{text-align:left;color:var(--흐린글);font-weight:500;font-size:12px;
     padding:var(--틈2) var(--틈3);border-bottom:1px solid var(--줄);white-space:nowrap}
  /* 세로 여백을 8px 로 올리면 139줄에서 278px 만큼 한 판에 덜 보인다. 6px 을
     눈금에 둔 이유가 이것이다 */
  td{padding:var(--틈2) var(--틈3);border-bottom:1px solid var(--흐린줄);vertical-align:top}
  /* 짧은 값이 한 글자씩 세로로 깨지던 것을 막는다. 넓으면 감싼 칸이 가로로 밀린다 */
  td.짧음,th.짧음{white-space:nowrap}
  td.제목{min-width:210px} td.근거{min-width:150px;max-width:330px}
  /* 유출 항목은 분류 이름 여럿이 「·」로 이어진다. 한 줄로 두면 표가 가로로
     너무 밀려서 감싸게 두되 너비를 묶는다 */
  td.항목,th.항목{min-width:120px;max-width:200px}
  tr:hover td{background:var(--짚음)}
  .수{font-variant-numeric:tabular-nums;text-align:right}
  .흐림{color:var(--흐린글)} .더흐림{color:var(--더흐린);font-size:12px}
  .감쌈{overflow-x:auto;border:1px solid var(--줄);border-radius:var(--둥2);background:var(--판)}

  /* 상태 딱지. **배지와 고르기 단추가 같은 색을 쓰므로 한 블록에서 낸다.**
     전에는 `.고르기 button.지금` 이 값 여섯을 복사해 두 벌이었고, 한쪽만 고치면
     어긋났다.

     대비를 다섯 다 7.3~7.6 으로 맞췄다. 전에는 4.4~8.3 으로 흩어져 있었고
     **하필 AA(4.5)를 못 넘는 4.4 가 「사건 X」라는 판정 결과였다.** */
  .표{display:inline-block;padding:0 var(--틈3);border-radius:var(--둥1);
      font-size:12px;line-height:1.7;white-space:nowrap;border:1px solid transparent}
  .미검토{background:#37301f;color:#e2c27f;border-color:#4a3f25}
  .사건O,.있음,
  .고르기 button.지금 {background:#1e352b;color:#86d3ae;border-color:#26463a}
  /* **사건X 를 올리브에서 청회색으로 옮겼다.** 전 값(#998 on #332)은 미검토와
     같은 노랑 계열이라, 113줄이 미검토인 표에서 「빛바랜 미검토」로 읽혔다.
     판정을 마친 줄과 안 한 줄이 같은 색 가족에 있으면 안 된다 */
  .사건X,
  .고르기 button.지금X{background:#272c37;color:#b7bccb;border-color:#333846}
  .직접{background:#302c3e;color:#c3bbe8;border-color:#3f394f}
  .없음{background:#3a2a2c;color:#e0a3a3;border-color:#4d3639}
  /* 「모른다」는 판정이 아니라 판정의 부재다. 채움을 빼고 테두리만 남긴다 */
  .미확인{background:none;color:var(--흐린글);border-color:var(--줄)}

  /* **좁아지면 code 상자가 실처럼 얇아진다.** 이름 150 + 단추 58 + 틈이 안 줄기
     때문이다. 줄이 밖으로 밀리는 게 아니라 무엇을 복사하는지 못 읽게 된다 */
  .명령{display:flex;gap:var(--틈3);align-items:center;margin:var(--틈1) 0;flex-wrap:wrap}
  .명령 code{flex:1;min-width:0;background:var(--깊판);border:1px solid var(--줄);
             border-radius:var(--둥2);padding:var(--틈2) var(--틈3);
             font:12px ui-monospace,Consolas,monospace;
             color:var(--코드글);overflow-x:auto;white-space:nowrap}
  .명령 button{background:var(--판2);border:1px solid var(--줄);color:var(--흐린글);
               border-radius:var(--둥2);padding:var(--틈2) var(--틈4);font:inherit;font-size:12px;
               cursor:pointer;white-space:nowrap}
  .명령 button:hover{color:var(--글);border-color:var(--점)}
  .명령 button.실패{color:var(--나쁨);border-color:var(--나쁨)}
  .명령 .이름{min-width:150px;color:var(--흐린글);font-size:12px}

  .거르개{display:flex;gap:var(--틈2);flex-wrap:wrap;margin-bottom:var(--틈4);align-items:center}
  .거르개 button{background:var(--판);border:1px solid var(--줄);color:var(--흐린글);
                 border-radius:var(--둥알약);padding:var(--틈1) var(--틈4);font:inherit;
                 font-size:12px;cursor:pointer}
  .거르개 button.켬{background:var(--판2);color:var(--글);border-color:var(--점)}
  .거르개 input{background:var(--판);border:1px solid var(--줄);color:var(--글);
                border-radius:var(--둥2);padding:var(--틈1) var(--틈4);font:inherit;
                font-size:13px;min-width:190px}
  .일감줄{display:flex;gap:var(--틈3);align-items:center;margin:var(--틈1) 0;flex-wrap:wrap}
  .일감줄 .돌리기{background:var(--판2);border:1px solid var(--줄);color:var(--글);
                  border-radius:var(--둥2);padding:var(--틈2) var(--틈4);font:inherit;font-size:13px;
                  cursor:pointer;min-width:190px;text-align:left}
  .일감줄 .돌리기:hover:not(:disabled){border-color:var(--점)}
  .일감줄 .돌리기:disabled{opacity:.45;cursor:not-allowed}
  .일감줄 .돌리기.도는중{border-color:var(--기다림);color:var(--기다림)}
  /* 「밖으로 요청을 보냅니다」. 그 줄에서 결과가 가장 큰 사실인데 지금은
     `.더흐림` 안에 들어 있어 대비 3.5:1 로 화면에서 가장 안 보인다 */
  .일감줄 b{color:var(--나쁨);font-weight:600}
  #로그{background:var(--깊판);border:1px solid var(--줄);border-radius:var(--둥2);
        padding:var(--틈4);font:12px/1.55 ui-monospace,Consolas,monospace;color:var(--코드글);
        max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all;
        margin-top:var(--틈3)}
  /* 딱지와 나란히 붙는 자리라 높이를 맞춘다. 전에는 칩 22.4px · 단추 25.2px 로
     달라 밑선이 어긋났다. 세로 여백을 버리고 line-height 로 높이를 만들면
     12px × 1.7 + 테두리 2 = 22.4px 로 둘이 정확히 같아진다.
     칠하는 색은 위 딱지 블록에서 같이 낸다 */
  .고르기{display:flex;gap:var(--틈1)}
  .고르기 button{background:var(--판2);border:1px solid var(--줄);color:var(--흐린글);
                 border-radius:var(--둥1);padding:0 var(--틈3);font:inherit;font-size:12px;
                 line-height:1.7;cursor:pointer;white-space:nowrap}
  .고르기 button:hover{color:var(--글);border-color:var(--점)}
  .고르기 button:disabled{opacity:.45;cursor:wait}
  .빔{color:var(--더흐린);padding:var(--틈6);text-align:center}
  footer{color:var(--더흐린);font-size:12px;margin-top:var(--틈7);line-height:1.8}

  /* 좁은 화면. **쿼리보다 flex-wrap 이 먼저다** — 쿼리는 내가 고른 폭에서만 듣고
     wrap 은 모든 폭에서 듣는다. 위에서 이미 감싸 두었고, 여기서는 안 줄어드는
     최소 폭만 푼다 */
  @media (max-width:900px){
    .틀{padding-left:var(--틈4);padding-right:var(--틈4)}
    .명령 .이름{min-width:0;flex-basis:100%}
    .일감줄 .더흐림{flex-basis:100%}
  }
  @media (max-width:560px){
    /* 로컬은 여섯 칸, 서버는 세 칸이라 그냥 두면 판마다 다른 모양으로 삐죽 남는다 */
    .요약 .칸{flex:1 1 calc(50% - var(--틈3));min-width:0}
  }
</style>
</head>
<body>
<div class="틀">
  <header>
    <h1>다크초코 대시보드</h1>
    <span class="구운때" id="구운때"></span>
  </header>
  <div id="탈">
  </div>

  <div class="요약" id="요약"></div>

  <nav>
    <button data-탭="제어판" class="켬">제어판</button>
    <button data-탭="사건">사건</button>
  </nav>

  <section id="제어판"></section>
  <section id="사건" hidden></section>

  <footer>
    <!-- 「화면이 명령을 만들지 못합니다」 는 「명령으로 치려면」 절을 가리키는 말로
         읽혔습니다. 그 절은 배포판에 없습니다. 뜻은 **화면이 아무 워크플로나 부를 수
         없다** 는 것이라 그대로 적습니다. 「명부 셋은…」 은 여기 없는 것을 설명하는
         문장이라 뺐습니다. -->
    <div><span id="어디">이 화면은 127.0.0.1 에만 뜹니다.</span> 돌릴 수 있는 것은 <b>정해진 목록</b>뿐이고
        화면이 아무 명령이나 만들어 보낼 수 없습니다. 노션에 쓰는 것은 <b>검토 여부 한 칸</b>뿐입니다.</div>
    <div>본문과 개인정보 값은 담지 않습니다.</div>
  </footer>
</div>

<script>
/* 같은 파일이 로컬(127.0.0.1)과 배포(workers.dev) 양쪽에 쓰입니다. 배포판에서
   「127.0.0.1 에만 뜹니다」 가 그대로 보이면 사실과 다르고, 실명이 든 화면이라
   오해가 위험합니다. 그래서 주소를 보고 문구를 바꿉니다. 데이터가 안 실려도
   돌아야 하므로 dash.js 보다 앞에 둡니다. */
(function(){
  var 집 = ["127.0.0.1", "localhost", "[::1]"].indexOf(location.hostname) >= 0;
  if (집) return;
  var 자리 = document.getElementById("어디");
  if (자리) 자리.textContent =
    "이 화면은 팀 비밀번호로 잠겨 있습니다. 실명과 미검토 줄이 들어 있으니 링크를 밖으로 돌리지 마십시오.";
})();
</script>

<script src="data/dash.js" onerror="window.__못읽음=true"></script>
<script>
(function(){
  const D = window.DASH;
  const $ = (s)=>document.querySelector(s);
  const 매김 = (n)=> (n==null?"-":Number(n).toLocaleString("ko-KR"));
  const 안전 = (s)=> String(s==null?"":s).replace(/[&<>"']/g,
      c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  if (window.__못읽음 || !D){
    $("#탈").innerHTML = '<div class="경고">구운 데이터가 없습니다. '
      + '<code>python apps/dash/build.py</code> 를 먼저 돌리십시오.</div>';
    return;
  }
  // 배포판에서는 Worker 가 노션을 직접 읽어 이 자리를 만듭니다. 그 읽기가 실패하면
  // 화면이 통째로 비는 대신 여기서 이유를 보입니다.
  if (D.오류){
    $("#탈").innerHTML = '<div class="경고">'+안전(D.오류)+'</div>';
    return;
  }
  $("#구운때").textContent = "구운 때 " + D.구운때;

  // **서버판인가.** 배포판은 수집기 PC 의 수집 표(SQLite)를 못 봅니다. 그 절을
  // 0 으로 그리면 「표가 비었다」 로 읽혀 더 나쁩니다. 아예 다른 것을 냅니다.
  const 서버 = !!D.제어판.서버;

  // 화면을 새로 읽어도 로그를 잃지 않게 잠깐 담아 두는 자리입니다. 이 파일은
  // 브라우저로 통째로 내려가므로 여기에 사람 이름을 적지 않습니다.
  const 로그자리 = "darkchoco-dash-log";

  const 탈 = [];
  if (!D.노션읽음) 탈.push("노션을 안 읽었습니다. [사건] 이 비어 있습니다."
      + (D.노션오류 ? " (" + 안전(D.노션오류) + ")" : ""));
  if (!서버 && !D.제어판.표있음) 탈.push("수집 표가 없습니다: " + 안전(D.제어판.표));
  if (탈.length) $("#탈").innerHTML = 탈.map(t=>'<div class="경고">'+t+'</div>').join("");

  // ── 요약 ──────────────────────────────────────────
  const 사건 = D.사건 || [];
  const 셈 = (f)=> 사건.filter(f).length;
  const 미검토 = 셈(x=>x.검토==="미검토");
  const 사건O  = 셈(x=>x.검토==="사건 O" || !x.검토);
  // 서버판에는 수집 표(SQLite)가 없어 그 두 칸을 안 냅니다. 로컬에서만 나옵니다.
  const 요약 = [
    ...(서버 ? [] : [["점", D.제어판.줄수, "수집 표 줄"]]),
    ["",      사건.length,          "노션 사건"],
    [미검토?"기다림":"", 미검토,     "미검토"],
    ["좋음",  사건O,                "사건 O"],
    ...(서버 ? [] : [["", D.제어판.관측, "게시 상태 관측"],
                     ["", D.요약.자리합, "지도 자리"]]),
  ];
  $("#요약").innerHTML = 요약.map(([꼴,n,이름])=>
    '<div class="칸 '+꼴+'"><b>'+매김(n)+'</b><span>'+이름+'</span></div>').join("");

  // ── 제어판 ────────────────────────────────────────
  const ev = D.제어판;
  const 소스별 = Object.entries(ev.소스별||{}).map(([k,v])=>k+" "+매김(v)).join(" · ") || "빔";
  let h = "";

  if (서버){
    // 배포판. 수집은 GitHub Actions 가 하고 이 화면은 노션을 직접 읽습니다.
    // 수집 표 · 최근 실행 · 설정 셋은 수집기 PC 를 봐야 아는 것이라 안 냅니다.
    h += '<h2>어디서 수집하나</h2><div class="감쌈"><table><tbody>'
      + '<tr><td class="흐림">수집</td><td>GitHub Actions <span class="더흐림">'
      + '— 여섯 시간마다 (KST 03 · 09 · 15 · 21시)</span></td></tr>'
      + '<tr><td class="흐림">이 화면</td><td>노션을 열 때마다 직접 읽습니다 '
      + '<span class="더흐림">— 수집기 PC 가 꺼져 있어도 최신입니다</span></td></tr>'
      // 「노션 사건」 줄은 뺐습니다. 바로 위 요약 칸에 같은 숫자가 이미 있습니다.
      + '</tbody></table></div>';
  } else {
    h += '<h2>수집 표</h2><div class="감쌈"><table><tbody>'
      + '<tr><td class="흐림">자리</td><td><code>'+안전(ev.표)+'</code></td></tr>'
      + '<tr><td class="흐림">줄</td><td>'+매김(ev.줄수)+' <span class="더흐림">('+안전(소스별)+')</span></td></tr>'
      + '<tr><td class="흐림">마지막 수집</td><td>'+안전(ev.마지막수집||"-")+'</td></tr>'
      + '<tr><td class="흐림">게시 상태 관측</td><td>'+매김(ev.관측)+'건</td></tr>'
      + '</tbody></table></div>';

    h += '<h2>최근 수집 실행</h2>';
    if (!(ev.실행||[]).length) h += '<div class="빔">아직 없습니다.</div>';
    else h += '<div class="감쌈"><table><thead><tr><th>날</th><th>무엇</th>'
      + '<th class="수">받음</th><th class="수">새것</th><th>메모</th></tr></thead><tbody>'
      + ev.실행.map(r=>'<tr><td>'+안전((r.날||"").slice(0,10))+'</td><td>'+안전(r.무엇)
        + '</td><td class="수">'+매김(r.받음)+'</td><td class="수">'+매김(r.새것)
        + '</td><td class="더흐림">'+안전(r.메모)+'</td></tr>').join("")
      + '</tbody></table></div>';

    h += '<h2>설정</h2><div class="감쌈"><table><thead><tr><th>이름</th><th>무엇</th>'
      + '<th>없으면 안 도는 것</th><th></th></tr></thead><tbody>'
      + (ev.설정||[]).map(s=>'<tr><td><code>'+안전(s.이름)+'</code></td><td class="흐림">'
        + 안전(s.무엇)+'</td><td class="더흐림">'+안전(s.쓰는곳)+'</td><td>'
        // **설정 유무에 노션 판정 클래스를 쓰지 않는다.** 없는 API 키는 「사람이
        // 검토하기를 기다리는 중」이 아니라 「손대야만 없어지는 것」이다. 클래스를
        // 같이 쓰면 나중에 한쪽 색을 고칠 때 다른 쪽이 조용히 따라 바뀐다
        + (s.있음 ? '<span class="표 있음">있음</span>' : '<span class="표 없음">없음</span>')
        + '</td></tr>').join("")
      + '</tbody></table></div>';
  }

  // **다 같은 말이면 절 제목에 한 번만 적습니다.** 전에는 일감마다 「밖으로 요청을
  // 보냅니다」 가 붙어 넷이 똑같이 반복됐습니다. 경고는 한 번 보일 때 읽히지,
  // 줄마다 있으면 안 읽힙니다. 일감에 따라 다를 때만 줄마다 답니다.
  const 일감들 = ev.일감 || [];
  const 다밖 = 일감들.length > 0 && 일감들.every(j => j.밖);

  h += '<h2>돌리기 <span class="더흐림">— '
    + (서버 ? '눌러서 GitHub Actions 에 맡깁니다. 끝나면 요약이 아래에 뜹니다'
            : '눌러서 실행합니다. 한 번에 하나만 돕니다')
    + (다밖 ? ' · <b>모두 밖으로 요청을 보냅니다</b>' : '')
    + '</span></h2>'
    + '<div id="일감">' + 일감들.map(j=>
        '<div class="일감줄"><button class="돌리기" data-일감="'+안전(j.열쇠)+'">'+안전(j.이름)+'</button>'
        + '<span class="더흐림">'+안전(j.설명)
        + (!다밖 && j.밖 ? ' · <b>밖으로 요청을 보냅니다</b>' : '')+'</span></div>'
      ).join("") + '</div>'
    + '<pre id="로그" hidden></pre>';

  // **명령이 없으면 절을 아예 안 냅니다.** 배포판은 이 목록이 늘 비어 있어서
  // 제목만 덩그러니 뜨는 빈 절이 됐습니다. 로컬은 run_jobs.py 가 채웁니다.
  if ((ev.명령||[]).length) {
    h += '<h2>명령으로 치려면 <span class="더흐림">— 눌러서 복사합니다</span></h2>'
      + ev.명령.map((c,i)=>'<div class="명령"><span class="이름">'+안전(c.이름)
        + '</span><code id="명령'+i+'">'+안전(c.줄)+'</code>'
        + '<button data-복사="명령'+i+'">복사</button></div>').join("");
  }

  $("#제어판").innerHTML = h;

  // **새로 읽기 전에 담아 둔 로그를 되살립니다.** 노션에 쓰는 일감은 끝나고 화면을
  // 다시 읽는데, 그때 「몇 건 넣었다」 가 로그와 함께 지워져 정작 결과를 못 봤습니다.
  // 한 번 되살리고 바로 지웁니다. 탭을 새로 열면 안 남습니다.
  try{
    const 옛로그 = sessionStorage.getItem(로그자리);
    if (옛로그){
      sessionStorage.removeItem(로그자리);
      const 상자 = $("#로그");
      if (상자){
        상자.hidden = false;
        상자.textContent = 옛로그;
        상자.scrollTop = 상자.scrollHeight;
      }
    }
  }catch(e){ /* 사생활 보호 창에서는 sessionStorage 가 막힙니다. 없어도 됩니다 */ }

  // ── 사건 ──────────────────────────────────────────
  let 검토거르개 = "전부", 소스거르개 = "전부", 찾기 = "";
  const 검토값 = ["전부","미검토","사건 O","사건 X"];
  const 소스값 = ["전부","랜섬웨어","텔레그램","포럼"];

  function 골라진(){
    const q = 찾기.trim().toLowerCase();
    return 사건.filter(x=>{
      if (검토거르개!=="전부"){
        const v = x.검토 || "사건 O";      // 빈칸은 사람이 올린 옛 사건이다 (DEV 4-9)
        if (v !== 검토거르개) return false;
      }
      if (소스거르개!=="전부" && (x.소스||"") !== 소스거르개) return false;
      if (q){
        /* 2026-09-22. 「근거」를 뺐다. 그 칸이 데이터에서 사라졌다.
           대신 업종과 유출 항목을 넣었다 — 둘 다 열로 그려지므로
           「보이는 것으로 찾는다」가 지켜진다 */
        const 다 = [x.제목,x.대상,x.자리,x.핸들,x.번호,x.업종,(x.항목||[]).join(" ")]
          .join(" ").toLowerCase();
        if (!다.includes(q)) return false;
      }
      return true;
    });
  }

  function 그리기(){
    const 목록 = 골라진();
    let s = '<div class="거르개">'
      + 검토값.map(v=>'<button data-검토="'+v+'" class="'+(v===검토거르개?"켬":"")+'">'+v
        + ' <span class="더흐림">'+ (v==="전부" ? 사건.length
            : 사건.filter(x=>(x.검토||"사건 O")===v).length) +'</span></button>').join("")
      + '<span style="width:10px"></span>'
      + 소스값.map(v=>'<button data-소스="'+v+'" class="'+(v===소스거르개?"켬":"")+'">'+v+'</button>').join("")
      + '<input id="찾기" placeholder="제목 · 대상 조직 · 플랫폼 · 업종 · 유출 항목으로 찾기" value="'+안전(찾기)+'">'
      + '</div>';

    if (!사건.length){
      s += '<div class="빔">노션을 안 읽었거나 줄이 없습니다.</div>';
    } else if (!목록.length){
      s += '<div class="빔">고른 조건에 맞는 줄이 없습니다.</div>';
    } else {
      /* 2026-09-22 에 열을 최현서가 고른 열셋으로 바꿨다 (+ 고르기와 노션 링크).
         **이 화면은 모든 데이터를 보는 곳이 아니라 사건 요약이다.**
         전에는 21칸을 실어 보내고 아홉만 그렸다. 「뽑되 안 그린다」가 가장 나쁘다.
         빠진 것 중 「근거」는 사람이 쓴 27줄 가운데 여덟 줄에 이메일 꼴이
         들어 있던 칸이고, 그것이 여기 그대로 그려지고 있었다 */
      s += '<div class="감쌈"><table><thead><tr>'
        + '<th class="짧음">검토</th><th class="짧음">고르기</th>'
        + '<th>자료 제목</th><th class="짧음">사건 ID</th><th class="짧음">상태</th>'
        + '<th>대상 조직</th><th class="짧음">업종</th><th class="짧음">국가</th>'
        + '<th class="항목">유출 항목</th><th class="짧음">게시 플랫폼</th>'
        + '<th class="짧음">게시자</th><th class="짧음">게시</th>'
        + '<th class="짧음">수집일</th><th class="짧음">수집자</th>'
        + '<th class="짧음"></th></tr></thead><tbody>'
        + 목록.map(x=>{
            const 검토 = x.검토 || "사건 O";
            const 검토꼴 = 검토==="미검토"?"미검토":(검토==="사건 X"?"사건X":"사건O");
            /* 수집자는 굽는 쪽에서 이미 사람/자동/미기입 으로 접혀 온다.
               팀원 실명은 여기까지 오지 않는다 (build.py 의 _누가) */
            const 누가 = x.수집자 || "미기입";
            return '<tr>'
              + '<td class="짧음"><span class="표 '+검토꼴+'" id="표'+안전(x.id)+'">'
                + 안전(검토)+'</span></td>'
              + '<td class="짧음"><div class="고르기" data-줄="'+안전(x.id)+'">'
                + '<button data-값="사건 O" class="'+(검토==="사건 O"?"지금":"")+'">O</button>'
                + '<button data-값="사건 X" class="'+(검토==="사건 X"?"지금X":"")+'">X</button>'
                + '<button data-값="미검토" class="'+(검토==="미검토"?"지금":"")+'" title="미검토로 되돌린다">↺</button>'
              + '</div></td>'
              + '<td class="제목">'+안전(x.제목||"(제목 없음)")+'</td>'
              + '<td class="더흐림 짧음">'+안전(x.번호||"")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.상태||"-")+'</td>'
              + '<td class="제목">'+안전(x.대상||"-")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.업종||"-")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.국가||"-")+'</td>'
              + '<td class="더흐림 항목">'+안전((x.항목||[]).join(" · "))+'</td>'
              + '<td class="흐림 짧음">'+안전(x.자리||"-")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.핸들||"-")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.게시||"")+'</td>'
              + '<td class="흐림 짧음">'+안전(x.수집일||"")+'</td>'
              + '<td class="더흐림 짧음">'+안전(누가)+'</td>'
              + '<td>'+(x.id?'<a href="https://www.notion.so/'+안전(x.id.replace(/-/g,""))
                  +'" target="_blank" rel="noopener">노션</a>':'')+'</td>'
              + '</tr>';
          }).join("")
        + '</tbody></table></div>'
        + '<div class="더흐림" style="margin-top:8px">'+매김(목록.length)+'줄. '
        + '<b>O / X 를 누르면 노션에 바로 반영됩니다.</b> ↺ 로 미검토로 되돌립니다. '
        + '위 숫자는 다시 구워야 맞춰집니다.</div>';
    }
    document.querySelector("#사건").innerHTML = s;
    const i = document.querySelector("#찾기");
    if (i){
      i.oninput = (e)=>{ 찾기 = e.target.value; const 끝=e.target.selectionStart;
        그리기(); const n=document.querySelector("#찾기"); n.focus(); n.setSelectionRange(끝,끝); };
    }
  }
  그리기();

  // ── 검토 여부 고르기 ──────────────────────────────
  // 서버가 대신 노션에 씁니다. 토큰은 서버 자리에만 있고 여기로 안 옵니다.
  async function 고르기(b){
    const 칸 = b.closest(".고르기");
    const 줄id = 칸.dataset.줄;
    const 값 = b.dataset.값;
    const 단추들 = [...칸.querySelectorAll("button")];
    단추들.forEach(x=>{ x.disabled = true; });
    try{
      const r = await fetch("/api/review", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({page_id: 줄id, 검토: 값}),
      });
      const d = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(d.오류 || ("HTTP " + r.status));

      // 화면과 손에 든 데이터를 같이 고칩니다. 다시 구울 때까지 이 값이 맞습니다.
      const 줄 = 사건.find(x=>x.id===줄id);
      if (줄) 줄.검토 = 값;
      const 표 = document.getElementById("표"+줄id);
      if (표){
        표.textContent = 값;
        표.className = "표 " + (값==="미검토"?"미검토":(값==="사건 X"?"사건X":"사건O"));
      }
      단추들.forEach(x=>{
        const 켬 = x.dataset.값===값;
        x.className = 켬 ? (값==="사건 X" ? "지금X" : "지금") : "";
      });
    }catch(e){
      alert("노션에 못 썼습니다.\n\n" + (e && e.message ? e.message : e));
    }finally{
      단추들.forEach(x=>{ x.disabled = false; });
    }
  }

  // ── 일감 돌리기 ───────────────────────────────────
  // 화면은 **열쇠만** 보냅니다. 무엇을 돌릴지는 서버의 run_jobs.py 가 정합니다.
  let 지켜보기 = null;
  function 단추들(){ return [...document.querySelectorAll(".돌리기")]; }

  function 상태그리기(s){
    const 로그 = document.querySelector("#로그");
    if (!로그) return;
    if (s.줄 && s.줄.length){
      로그.hidden = false;
      로그.textContent = s.줄.join("\n");
      로그.scrollTop = 로그.scrollHeight;
    }
    단추들().forEach(b=>{
      const 이것 = b.dataset.일감 === s.열쇠;
      b.disabled = !!s.돌고있나;
      b.classList.toggle("도는중", !!s.돌고있나 && 이것);
    });
    if (!s.돌고있나 && 지켜보기){
      clearInterval(지켜보기); 지켜보기 = null;
      const 끝말 = (s.코드===0) ? "끝났다" : ("끝났다 (코드 " + s.코드 + ")");
      로그.textContent += "\n── " + 끝말 + " · " + (s.끝 || "") + " ──";
      // **노션이 바뀐 일감만 새로 읽습니다.** 배포판에서 수집을 돌린 뜻이 「돌리고
      // 나서 결과를 본다」 이므로 사람이 새로고침을 기억할 일이 없게 합니다. 다만
      // 미리보기 둘은 노션을 안 바꿉니다. 그때까지 새로 읽으면 화면은 그대로인데
      // 이 로그만 지워져, 보려고 누른 숫자를 못 보고 끝납니다.
      // 읽기 전에 로그를 담아 두고 위쪽에서 되살립니다.
      if (서버 && s.노션){
        로그.textContent += "\n화면을 새로 읽습니다...";
        try{ sessionStorage.setItem(로그자리, 로그.textContent); }catch(e){}
        setTimeout(()=>location.reload(), 1500);
      }
      로그.scrollTop = 로그.scrollHeight;
    }
  }

  async function 돌리기(b){
    const 열쇠 = b.dataset.일감;
    단추들().forEach(x=>{ x.disabled = true; });
    try{
      const r = await fetch("/api/run", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({열쇠}),
      });
      const s = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(s.오류 || ("HTTP " + r.status));
      상태그리기(s);
      if (지켜보기) clearInterval(지켜보기);
      지켜보기 = setInterval(async ()=>{
        try{
          // **열쇠를 같이 보냅니다.** 안 보내면 서버가 수집 워크플로만 보고,
          // 게시 상태 추적을 돌려도 화면에는 수집의 지난 실행이 뜬다.
          const r2 = await fetch("/api/status", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({열쇠})});
          상태그리기(await r2.json());
        }catch(e){ /* 서버가 멎으면 다음 번에 다시 본다 */ }
      // 로컬은 이 PC 의 프로세스라 자주 물어도 됩니다. 배포판은 물을 때마다
      // GitHub API 를 부르므로 간격을 벌립니다. 여럿이 같이 보면 그만큼 곱해집니다.
      }, 서버 ? 6000 : 1200);
    }catch(e){
      단추들().forEach(x=>{ x.disabled = false; });
      alert("못 돌렸습니다.\n\n" + (e && e.message ? e.message : e));
    }
  }

  // ── 누르기 ────────────────────────────────────────
  document.addEventListener("click", (e)=>{
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.탭){
      document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("켬", x===b));
      document.querySelector("#제어판").hidden = b.dataset.탭!=="제어판";
      document.querySelector("#사건").hidden   = b.dataset.탭!=="사건";
    }
    if (b.dataset.복사){
      const t = document.getElementById(b.dataset.복사).textContent;
      navigator.clipboard.writeText(t).then(()=>{
        const 옛 = b.textContent; b.textContent = "복사됨";
        setTimeout(()=>{ b.textContent = 옛; }, 1200);
      }).catch(()=>{ b.textContent = "복사 실패"; });
    }
    if (b.dataset.검토){ 검토거르개 = b.dataset.검토; 그리기(); }
    if (b.dataset.소스){ 소스거르개 = b.dataset.소스; 그리기(); }
    if (b.dataset.값){ 고르기(b); }
    if (b.dataset.일감){ 돌리기(b); }
  });
})();
</script>
</body>
</html>
