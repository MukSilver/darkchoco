[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkchoco-packages"
version = "0.1.0"
description = "다크초코 공용 부품 — 여러 도구가 같이 쓰는 접속·저장·안전 코드"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# 기본 설치는 밖에서 받아오는 것이 없습니다.
# dc_console 과 dc_notion 과 dc_store 는 표준 라이브러리만 씁니다.
dependencies = []

# 필요한 것만 골라 받습니다.
#     pip install -e packages              가벼운 둘만
#     pip install -e "packages[safety]"    + requests
#     pip install -e "packages[all]"       전부
[project.optional-dependencies]
safety = ["requests>=2.31"]
ransomfeed = ["requests>=2.31"]          # dc_safety 를 통해 씁니다
telegram = ["telethon>=1.36,<2"]
all = ["requests>=2.31", "telethon>=1.36,<2"]

[tool.setuptools]
# 폴더 이름이 곧 패키지 이름입니다. 여기서만 찾습니다.
packages = [
    "dc_console",
    # 2026-09-07. 한국 관련 판정을 apps/kr-leak-alarm 에서 올렸습니다.
    # 노션에 올리는 쪽과 알림 쪽이 같은 판정을 써야 해서입니다.
    "dc_kr",
    "dc_notion",
    "dc_ransomfeed",
    "dc_safety",
    # 2026-08-31 에 넣었습니다. 빠져 있어서 pip install -e packages 로는
    # 안 깔렸습니다. 지금 도는 것은 부르는 쪽(hub/events/run.py ·
    # skills/collect/store.py)이 sys.path 에 packages 를 넣기 때문입니다.
    "dc_store",
    "dc_telegram",
]

[tool.setuptools.package-dir]
"" = "."

# 키워드 목록은 코드 옆에 둡니다. 파일이 빠지면 판정이 조용히 기본값으로 떨어집니다.
[tool.setuptools.package-data]
dc_kr = ["data/*.json"]
